<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470"
     font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- lane labels -->
  <text x="8" y="18" font-size="10" font-weight="700" fill="#6b7280">DECISION</text>
  <text x="600" y="18" font-size="10" font-weight="700" fill="#6b7280">OUTCOME</text>

  <!-- steps -->
  <g font-size="11.5" fill="#16181d">
    <rect x="8" y="28" width="420" height="40" rx="4" fill="#ffffff" stroke="#d9dce2"/>
    <text x="22" y="45" font-weight="700">1 · Master switch</text>
    <text x="22" y="61" font-size="10" fill="#6b7280">ConfigManager.getMcpServerEnabled() — off by default</text>

    <rect x="8" y="82" width="420" height="40" rx="4" fill="#ffffff" stroke="#d9dce2"/>
    <text x="22" y="99" font-weight="700">2 · Explicit per-tool policy = DISABLED</text>
    <text x="22" y="115" font-size="10" fill="#6b7280">set by the user in Settings; a session grant cannot override it</text>

    <rect x="8" y="136" width="420" height="40" rx="4" fill="#ffffff" stroke="#d9dce2"/>
    <text x="22" y="153" font-weight="700">3 · Explicit per-tool policy = ALWAYS_ALLOW</text>
    <text x="22" y="169" font-size="10" fill="#6b7280">survives restarts; not undone by the auto-approve toggle</text>

    <rect x="8" y="190" width="420" height="40" rx="4" fill="#ffffff" stroke="#d9dce2"/>
    <text x="22" y="207" font-weight="700">4 · Unexpired session grant</text>
    <text x="22" y="223" font-size="10" fill="#6b7280">keyed to client name + tool, 8 h TTL, cleared on server stop</text>

    <rect x="8" y="244" width="420" height="40" rx="4" fill="#ffffff" stroke="#d9dce2"/>
    <text x="22" y="261" font-weight="700">5 · READ_ONLY and auto-approve is on</text>
    <text x="22" y="277" font-size="10" fill="#6b7280">only when the user has set no explicit policy for the tool</text>

    <rect x="8" y="298" width="420" height="40" rx="4" fill="#ffffff" stroke="#d9dce2"/>
    <text x="22" y="315" font-weight="700">6 · A GUI window exists to ask in</text>
    <text x="22" y="331" font-size="10" fill="#6b7280">MCLauncherGuiController.getTopStageOrNull()</text>

    <rect x="8" y="352" width="420" height="54" rx="4" fill="#fdf3e2" stroke="#8a5a00"/>
    <text x="22" y="370" font-weight="700">7 · Consent dialog — 120 s deadline</text>
    <text x="22" y="386" font-size="10" fill="#6b7280">names the client, the tool and its arguments</text>
    <text x="22" y="401" font-size="10" fill="#6b7280">Allow once · Allow for this session · anything else</text>
  </g>

  <!-- outcomes -->
  <g font-size="11">
    <rect x="600" y="28" width="172" height="28" rx="4" fill="#fbecec" stroke="#9b2c2c"/>
    <text x="614" y="47" fill="#9b2c2c" font-weight="700">off → DENY</text>

    <rect x="600" y="82" width="172" height="28" rx="4" fill="#fbecec" stroke="#9b2c2c"/>
    <text x="614" y="101" fill="#9b2c2c" font-weight="700">yes → DENY</text>

    <rect x="600" y="136" width="172" height="28" rx="4" fill="#e8f0ed" stroke="#2f5d50"/>
    <text x="614" y="155" fill="#2f5d50" font-weight="700">yes → ALLOW</text>

    <rect x="600" y="190" width="172" height="28" rx="4" fill="#e8f0ed" stroke="#2f5d50"/>
    <text x="614" y="209" fill="#2f5d50" font-weight="700">yes → ALLOW</text>

    <rect x="600" y="244" width="172" height="28" rx="4" fill="#e8f0ed" stroke="#2f5d50"/>
    <text x="614" y="263" fill="#2f5d50" font-weight="700">yes → ALLOW</text>

    <rect x="600" y="298" width="172" height="28" rx="4" fill="#fbecec" stroke="#9b2c2c"/>
    <text x="614" y="317" fill="#9b2c2c" font-weight="700">no → DENY</text>

    <rect x="600" y="352" width="172" height="26" rx="4" fill="#e8f0ed" stroke="#2f5d50"/>
    <text x="614" y="370" fill="#2f5d50" font-weight="700">allowed → run</text>
    <rect x="600" y="382" width="172" height="26" rx="4" fill="#fbecec" stroke="#9b2c2c"/>
    <text x="614" y="400" fill="#9b2c2c" font-weight="700">denied / timed out</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)">
    <path d="M428,44 L596,44"/>
    <path d="M428,98 L596,98"/>
    <path d="M428,152 L596,152"/>
    <path d="M428,206 L596,206"/>
    <path d="M428,260 L596,260"/>
    <path d="M428,314 L596,314"/>
    <path d="M428,368 L596,366"/>
    <path d="M428,392 L596,394"/>
    <path d="M218,68 L218,78"/>
    <path d="M218,122 L218,132"/>
    <path d="M218,176 L218,186"/>
    <path d="M218,230 L218,240"/>
    <path d="M218,284 L218,294"/>
    <path d="M218,338 L218,348"/>
  </g>
  <g font-size="9.5" fill="#6b7280">
    <text x="226" y="76">on</text>
    <text x="226" y="130">no</text>
    <text x="226" y="184">no</text>
    <text x="226" y="238">no</text>
    <text x="226" y="292">no</text>
    <text x="226" y="346">yes</text>
  </g>

  <rect x="8" y="424" width="764" height="36" rx="4" fill="#f7f8fa" stroke="#d9dce2"/>
  <text x="22" y="441" font-size="10.5" fill="#3d434e" font-weight="700">Every branch that cannot reach an affirmative answer resolves to DENY.</text>
  <text x="22" y="455" font-size="10" fill="#6b7280">A settings read that throws, an authorizer that throws, a prompt that throws, a prompt that times out — all deny.</text>
</svg>
