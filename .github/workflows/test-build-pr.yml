name: Test Build (Pull Request)

on: pull_request

# Least-privilege default for the workflow's GITHUB_TOKEN. PR test builds only
# need to check out source, run Maven, and upload artifacts — none of those
# require write access to repo contents. Individual jobs can grant more later
# if needed; nothing currently does.
permissions:
  contents: read

jobs:
  # Resolve the revision once on a Linux runner, then fan out to the platform
  # builds. We *can't* rely on the derive-revision-from-git step in pom.xml:
  # Maven resolves <version>${revision}</version> during model-building, which
  # runs BEFORE the initialize phase, so any property the gmavenplus script
  # mutates at initialize is invisible to flatten / the jar plugin (those read
  # the frozen model). Passing -Drevision= on the CLI sidesteps this — user
  # properties win during model interpolation — which is why the release
  # workflow's build jobs work and the gmavenplus path alone does not.
  prepare:
    name: Compute Test Build Version
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve revision from git describe
        id: version
        shell: bash
        run: |
          REV=$(git describe --tags --dirty=.dirty --always)
          echo "revision=$REV" >> $GITHUB_OUTPUT
          echo "Resolved revision: $REV"

  # Dedicated unit-test gate. The platform `package` builds further down
  # already run tests as a side effect of the Maven `package` phase, but
  # burying a test failure inside a 10-minute jpackage run makes it hard
  # to spot at a glance in the PR check timeline. Running `mvn test` once
  # here on Linux (the suite is JVM-only, no platform-sensitive cases yet)
  # surfaces failures distinctly within seconds, and the platform builds
  # `needs:` this job so they skip on test failure instead of burning four
  # full runner allotments rebuilding for an outcome that's already known.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 26 (Zulu FX)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'

      - name: Run unit tests
        # -s .mvn/ci-settings.xml: route all but the two scoped third-party repos
        # through Maven Central (dependency-confusion hardening, see the file).
        run: mvn -B -s .mvn/ci-settings.xml test --file pom.xml -Drevision=${{ needs.prepare.outputs.revision }}

      # Surfaces JUnit XML output as a downloadable artifact on test
      # failures — quicker than scrolling through the raw log when a
      # specific assertion failed. surefire-reports/ is created even
      # when tests pass; the if-no-files-found:warn keeps a successful
      # run from spuriously failing this step.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-pr${{ github.event.pull_request.number }}
          path: build/target/surefire-reports/

      # Coverage report. jacoco:report is a separate goal because the `report`
      # execution is bound to `verify`, and this job deliberately stops at `test`
      # to stay fast. Reporting only -- there is no coverage threshold, so this
      # cannot fail the build; it exists so a reviewer can see what a PR did to
      # coverage without running Maven locally.
      - name: Generate coverage report
        if: always()
        run: mvn -B -s .mvn/ci-settings.xml jacoco:report --file pom.xml -Drevision=${{ needs.prepare.outputs.revision }}

      - name: Summarise coverage
        if: always()
        shell: bash
        run: |
          CSV=build/target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {mi+=$4; mc+=$5; li+=$8; lc+=$9} END {
              printf "### Coverage\n\n"
              printf "| Metric | Covered | Total | %% |\n|---|---:|---:|---:|\n"
              printf "| Instructions | %d | %d | %.2f%% |\n", mc, mc+mi, 100*mc/(mc+mi)
              printf "| Lines | %d | %d | %.2f%% |\n", lc, lc+li, 100*lc/(lc+li)
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-pr${{ github.event.pull_request.number }}
          path: build/target/site/jacoco/
          if-no-files-found: warn

  # Opt-in JavaFX UI tests. These are gated behind MMCL_RUN_TESTFX so they never
  # run in the default build (locally or in the `unit-tests` job above), because
  # GUI automation is slow and prone to environment-specific flakiness. Running
  # them here under xvfb gives visibility into GUI regressions without letting
  # that flakiness block a PR:
  #
  #   - continue-on-error: true, so a failure is reported but not fatal.
  #   - No other job `needs:` this one, so nothing waits on it.
  #
  # If these become reliable enough to gate on, drop continue-on-error and add
  # this job to the platform builds' `needs:` list.
  ui-tests:
    name: UI Tests (TestFX, non-blocking)
    runs-on: ubuntu-latest
    needs: prepare
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 26 (Zulu FX)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'

      # TestFX needs a display. xvfb is used rather than Monocle because it needs
      # no extra dependency and works with the stock Zulu FX JDK.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run TestFX suite
        env:
          MMCL_RUN_TESTFX: 'true'
        run: xvfb-run -a mvn -B -s .mvn/ci-settings.xml test --file pom.xml -Drevision=${{ needs.prepare.outputs.revision }}

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testfx-reports-pr${{ github.event.pull_request.number }}
          path: build/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
          if-no-files-found: warn

  build-windows:
    name: Test Build (Windows)
    needs: [prepare, unit-tests]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 26 (Zulu FX)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'

      # WiX 3.14 ships on windows-latest runners but isn't on PATH. jpackage's
      # MSI generation shells out to `light.exe`, and the Burn bootstrapper
      # steps need `candle.exe` / `light.exe` too — without this the Windows
      # `package` phase fails before the first MSI is written.
      - name: Set path for WiX Toolset
        run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $GITHUB_PATH
        shell: bash

      # shell: bash is required — PowerShell 7 tokenizes the dotted revision
      # value (e.g. "2025.1.1-255-g1c8586c") on the first `.`, passing
      # "-Drevision=2025" and ".1.1-255-g1c8586c" to mvn as two separate args.
      # Maven then interprets the dotted tail as a lifecycle phase and aborts
      # with "Unknown lifecycle phase". Git Bash handles dotted args verbatim.
      - name: Build and package
        shell: bash
        run: mvn -B -s .mvn/ci-settings.xml package --file pom.xml -Drevision=${{ needs.prepare.outputs.revision }}

      # Mirror the release workflow's flat staging + scope-suffix rename so PR
      # downloads are labeled the same way the eventual release will be.
      - name: Stage Windows installers with scope-suffixed names
        shell: bash
        run: |
          mkdir -p windows-dist
          cp "build/packaging/Mica Minecraft Launcher Setup.exe" windows-dist/
          cp build/packaging/user/*.msi    "windows-dist/Mica Minecraft Launcher-user.msi"
          cp build/packaging/machine/*.msi "windows-dist/Mica Minecraft Launcher-system.msi"
          ls -la windows-dist/

      - name: Upload Windows test-build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-pr${{ github.event.pull_request.number }}
          path: windows-dist/*
          retention-days: 14
          if-no-files-found: error

  build-macos-arm:
    name: Test Build (macOS arm64)
    needs: [prepare, unit-tests]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 26 (Zulu FX)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'

      - name: Build and package
        run: mvn -B -s .mvn/ci-settings.xml package --file pom.xml -Drevision=${{ needs.prepare.outputs.revision }}

      # Mirror the release workflow's flat staging + arch-suffix rename so
      # PR downloads are labeled the same way the eventual release will be,
      # and so the arm/intel uploads don't share filenames.
      - name: Stage macOS arm64 installers with arch-suffixed names
        shell: bash
        run: |
          mkdir -p macos-arm-dist
          for f in build/packaging/*.dmg; do
            base=$(basename "$f" .dmg)
            cp "$f" "macos-arm-dist/${base}-arm64.dmg"
          done
          for f in build/packaging/*.pkg; do
            base=$(basename "$f" .pkg)
            cp "$f" "macos-arm-dist/${base}-arm64.pkg"
          done
          ls -la macos-arm-dist/

      - name: Upload macOS arm64 test-build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-pr${{ github.event.pull_request.number }}
          path: macos-arm-dist/*
          retention-days: 14
          if-no-files-found: error

  # Intel coverage on PRs so x64-specific regressions surface before merge,
  # not after the release workflow runs on main. macos-15-intel is the
  # current x86_64-capable GHA runner — GitHub retired the macos-13 image
  # on 2025-12-08, so jobs requesting `macos-13` now queue indefinitely
  # (no runner with that label exists). Apple Silicon `macos-latest` only
  # produces arm64 binaries, so a distinct Intel runner is still needed
  # until GitHub fully drops x86_64 macOS support in Fall 2027.
  build-macos-intel:
    name: Test Build (macOS x64 Intel)
    needs: [prepare, unit-tests]
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 26 (Zulu FX)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'

      - name: Build and package
        run: mvn -B -s .mvn/ci-settings.xml package --file pom.xml -Drevision=${{ needs.prepare.outputs.revision }}

      - name: Stage macOS Intel installers with arch-suffixed names
        shell: bash
        run: |
          mkdir -p macos-intel-dist
          for f in build/packaging/*.dmg; do
            base=$(basename "$f" .dmg)
            cp "$f" "macos-intel-dist/${base}-intel.dmg"
          done
          for f in build/packaging/*.pkg; do
            base=$(basename "$f" .pkg)
            cp "$f" "macos-intel-dist/${base}-intel.pkg"
          done
          ls -la macos-intel-dist/

      - name: Upload macOS x64 test-build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-pr${{ github.event.pull_request.number }}
          path: macos-intel-dist/*
          retention-days: 14
          if-no-files-found: error

  build-linux:
    name: Test Build (Linux)
    needs: [prepare, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 26 (Zulu FX)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'

      - name: Install packaging tools
        run: sudo apt-get install -y dpkg fakeroot rpm

      - name: Build and package
        run: mvn -B -s .mvn/ci-settings.xml package --file pom.xml -Drevision=${{ needs.prepare.outputs.revision }}

      - name: Upload Linux test-build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-pr${{ github.event.pull_request.number }}
          path: |
            build/packaging/*.deb
            build/packaging/*.rpm
          retention-days: 14
          if-no-files-found: error

      - name: Upload fat JAR test-build artifact
        uses: actions/upload-artifact@v7
        with:
          name: fat-jar-pr${{ github.event.pull_request.number }}
          path: build/target/*-jar-with-dependencies.jar
          retention-days: 14
          if-no-files-found: error
