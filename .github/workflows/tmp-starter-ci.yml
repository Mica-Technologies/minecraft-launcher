# TEMPORARY: builds and exercises the macOS / Linux native starters. Lives only on the
# tmp/starter-ci branch and is deleted with it; never merge.
name: TEMP starter CI

on:
  push:
    branches: [tmp/starter-ci]

jobs:
  macos:
    name: macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'
      - name: Build and package
        shell: bash
        run: |
          mkdir -p starter-results
          set -o pipefail
          mvn -B -s .mvn/ci-settings.xml package --file pom.xml -DskipTests -Drevision=2026.10.14 2>&1 | tee starter-results/build.log
      - name: Exercise the starter
        if: always()
        shell: bash
        run: bash ci-tmp/test-starter-mac.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: starter-${{ matrix.os }}
          path: starter-results/

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '26'
          java-package: jdk+fx
          cache: 'maven'
      - name: Install packaging and test tools
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot rpm xvfb imagemagick libgtk-3-0
      - name: Build and package
        shell: bash
        run: |
          mkdir -p starter-results
          set -o pipefail
          mvn -B -s .mvn/ci-settings.xml package --file pom.xml -DskipTests -Drevision=2026.10.14 2>&1 | tee starter-results/build.log
      - name: Exercise the starter
        if: always()
        shell: bash
        run: bash ci-tmp/test-starter-linux.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: starter-linux
          path: starter-results/
