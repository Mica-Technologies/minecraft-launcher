modConflict.optifineSodium.title=OptiFine e Sodium sono incompatibili
modConflict.optifineSodium.description=Sono installati sia OptiFine che Sodium. Patchano gli stessi interni di rendering di Minecraft in modi incompatibili e si bloccano all'avvio. Disabilitane uno: Sodium \u00E8 la scelta nativa di Fabric e OptiFine funziona su Forge o con un bridge OptiFabric.
modConflict.jeiRei.title=JEI e REI sono entrambi installati
modConflict.jeiRei.description=Just Enough Items (JEI) e Roughly Enough Items (REI) registrano entrambi lo stato del visualizzatore di ricette con gli stessi identificatori e si bloccano con errori "ID ricetta duplicata" al caricamento del mondo. Disabilitarne uno. Hanno caratteristiche equivalenti, quindi la scelta \u00E8 preferibile.
