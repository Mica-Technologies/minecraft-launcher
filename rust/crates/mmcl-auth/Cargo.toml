[package]
name = "mmcl-auth"
description = "Microsoft / Xbox / Minecraft sign-in protocol, the per-account encrypted store, the account manager, launch account resolution and the sign-in flows (web view helper, device code, WAM)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mmcl-core.workspace = true
mmcl-i18n.workspace = true
mmcl-log.workspace = true
mmcl-net.workspace = true
mmcl-secure.workspace = true
mmcl-config.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
base64.workspace = true
uuid.workspace = true
url.workspace = true
flate2.workspace = true

# The Windows account broker (WAM). Built on every Windows target, used only when `auth.wam`
# is on and a client ID of our own is configured.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Security_Authentication_Web_Core",
    "Security_Credentials",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
windows-future = "0.3"

[dev-dependencies]
tempfile.workspace = true
