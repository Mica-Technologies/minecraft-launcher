[package]
name = "mmcl-session"
description = "Game sessions: one per launch with its phase machine, launch admission and the session registry, game output capture (GameLog), and the running-game follower."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mmcl-core.workspace = true
mmcl-log.workspace = true
mmcl-i18n.workspace = true
mmcl-modpack.workspace = true
mmcl-progress.workspace = true
tokio.workspace = true
tokio-util = "0.7"
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
regex.workspace = true
