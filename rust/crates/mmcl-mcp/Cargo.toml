[package]
name = "mmcl-mcp"
description = "The launcher's Model Context Protocol server: JSON-RPC over loopback Streamable HTTP, tools, resources, the approval system, the --mcp stdio relay and client setup snippets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mmcl-core.workspace = true
mmcl-i18n.workspace = true
mmcl-log.workspace = true
mmcl-util.workspace = true
mmcl-engine.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
rand.workspace = true
hex.workspace = true
subtle.workspace = true
url.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
socket2 = "0.6"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile.workspace = true
