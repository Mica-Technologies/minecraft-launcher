[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Mica Technologies"]
repository = "https://github.com/Mica-Technologies/minecraft-launcher"

[workspace.dependencies]
gpui = "0.2.2"

[profile.dev]
# Dependencies optimised a little so GPUI windows are usable in debug builds.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
