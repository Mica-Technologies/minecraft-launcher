settings.fxml.useModpackColors=Anv\u00E4nd modpaketets f\u00E4rger
settings.fxml.lightUpThe=Lys upp tangentbordet i f\u00E4rger h\u00E4mtade fr\u00E5n det k\u00F6rande modpaketets logotyp. N\u00E4r detta \u00E4r av anv\u00E4nds accentpaletten fr\u00E5n startprogrammets tema.
settings.fxml.highlightMinecraftKeys=Markera Minecraft-tangenterna
settings.fxml.overlayWasdE=Visar WASD / E / Q / F / Blanksteg / Shift / Ctrl i en kontrasterande accentf\u00E4rg ovanp\u00E5 modpaketets bakgrundsf\u00E4rg, s\u00E5 att speltangenterna syns direkt.
settings.fxml.test=Testa
settings.fxml.flashesSolidMagenta=Blinkar i fast magenta (RGB 255, 0, 255) p\u00E5 alla anslutna enheter i 2 sekunder och \u00E5terst\u00E4ller sedan f\u00F6reg\u00E5ende effekt. En stadig blinkning med full ljusstyrka bekr\u00E4ftar att backend n\u00E5r din h\u00E5rdvara. Obs f\u00F6r Razer Chroma: Chroma Connect skickar bara bildrutor till tredjepartsenheter (chassifl\u00E4ktar, ljuslister osv.) n\u00E4r en prim\u00E4r Razer-enhet \u2013 tangentbord, mus eller musmatta \u2013 ocks\u00E5 \u00E4r ansluten. Om bara tredjepartsenheterna flimrar eller f\u00F6rblir sl\u00E4ckta, anslut ett Razer-tangentbord eller en Razer-mus och f\u00F6rs\u00F6k igen. Flimmer trots att en prim\u00E4r enhet \u00E4r ansluten betyder oftast att en annan RGB-app (Synapse, iCUE, Signal RGB) konkurrerar om enheten.
