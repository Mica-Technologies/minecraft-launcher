crash.nativeLib.summary=JVM:en kunde inte l\u00E4sa in ett av Minecrafts nativebibliotek (oftast LWJGL eller en JNI-bindning). Vanliga orsaker \u00E4r att ett antivirusprogram har satt filen i karant\u00E4n, en skadad installation eller \u2013 p\u00E5 Linux \u2013 ett saknat systembibliotek. Att installera om modpaketet brukar l\u00F6sa det.
