crash.mixin.summary=En mods mixin-patch kunde inte till\u00E4mpas{0}. Det betyder oftast att tv\u00E5 mods f\u00F6rs\u00F6ker patcha samma klass, eller att en av dem inte st\u00F6der den h\u00E4r Minecraft-versionen \u00E4n.
crash.mixin.title=Mixin-konflikt mellan mods
crash.modLoading.summaryGeneric=Forge kunde inte l\u00E4sa in paketets mods korrekt. De vanligaste orsakerna \u00E4r ett saknat beroende, en mod f\u00F6r en annan Minecraft-/Forge-version eller tv\u00E5 mods som inte fungerar ihop.
crash.modLoading.summaryWithClass=En mod f\u00F6rs\u00F6kte anv\u00E4nda klassen "{0}" men den hittades inte. Det betyder oftast att en mod som kr\u00E4vs som beroende saknas, eller att en mod f\u00F6r en annan Minecraft-/Forge-version har kommit med.
crash.modLoading.title=Inl\u00E4sningen av mods misslyckades
crash.modMcMismatch.summary=En mod i paketet byggdes f\u00F6r Minecraft {0}, men paketet startar Minecraft {1}. Nedgradera paketets Minecraft-version, byt ut moden mot en som \u00E4r byggd f\u00F6r {1} eller ta bort den.
