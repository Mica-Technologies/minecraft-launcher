crash.optifineSodium.summary=B\u00E5de OptiFine och Sodium \u00E4r installerade. De patchar samma delar av Minecrafts rendering p\u00E5 inkompatibla s\u00E4tt och kan inte anv\u00E4ndas samtidigt \u2013 v\u00E4lj en. Sodium kr\u00E4ver Fabric Loader; OptiFine fungerar med Forge eller via OptiFabric. Inaktivera-knapparna nedan byter namn p\u00E5 en av de tv\u00E5 jar-filerna till {name}.jar.disabled s\u00E5 att modladdaren hoppar \u00F6ver den vid n\u00E4sta start.
