crash.audio.summary=Minecraft kunde inte initiera ljudsystemet. P\u00E5 Linux beror det oftast p\u00E5 att PulseAudio och ALSA inte passar ihop (s\u00E4rskilt i containrar eller nyinstallerade system); p\u00E5 Windows \u00E4r det oftast en inaktiverad eller fr\u00E5nkopplad utenhet. Som en tillf\u00E4llig l\u00F6sning kan du ocks\u00E5 st\u00E4nga av Musik och ljud i spelet.
crash.audio.title=Initieringen av ljudet misslyckades
crash.auth.summary=Spelet avvisade sessionstoken som startprogrammet skickade. Oftast har den sparade inloggningen g\u00E5tt ut; logga ut fr\u00E5n startprogrammet och logga in igen s\u00E5 l\u00F6ser det sig.
crash.auth.title=Minecraft kunde inte autentisera
crash.diskFull.summary=Diskutrymmet tog slut under starten. Frig\u00F6r utrymme \u2013 v\u00E4rldar i modpaket, gamla sk\u00E4rmdumpar och kraschrapporter i paketets installationsmapp tar oftast mest plats \u2013 och f\u00F6rs\u00F6k igen.
crash.diskFull.title=Disken \u00E4r full
crash.fileLock.summary=En fil som spelet f\u00F6rs\u00F6kte skriva var l\u00E5st av en annan process. P\u00E5 Windows \u00E4r det n\u00E4stan alltid ett antivirusprogram (eller Windows Defender) som skannar den nedladdade moden eller k\u00F6rmilj\u00F6n \u2013 l\u00E4gg till startprogrammets installationsmapp som undantag och f\u00F6rs\u00F6k starta igen. Den andra vanliga l\u00F6sningen \u00E4r att st\u00E4nga OneDrive eller andra synkklienter som pekar p\u00E5 installationsmappen.
crash.fileLock.title=Filen \u00E4r l\u00E5st av en annan process
crash.forgeDep.summary=Moden "{0}" kr\u00E4ver att {1} {2} \u00E4r installerad, men ingen kompatibel version \u00E4r inl\u00E4st. L\u00E4gg till det saknade beroendet, uppdatera det befintliga till en matchande version eller ta bort moden som kr\u00E4ver det.
crash.forgeDep.title=Modberoende saknas eller har fel version
crash.gpu.summary=Minecraft kunde inte initiera grafiken. Vanliga orsaker \u00E4r inaktuella grafikdrivrutiner, att fel grafikkort v\u00E4ljs p\u00E5 en b\u00E4rbar dator med b\u00E5de integrerad och dedikerad grafik, eller fj\u00E4rrskrivbordssessioner d\u00E4r OpenGL inte \u00E4r h\u00E5rdvaruaccelererat.
crash.gpu.title=Initieringen av grafiken misslyckades
crash.javaVersion.manifestSuffix=\ Den Java-version som kr\u00E4vs anges normalt i modpaketets manifest.
crash.javaVersion.summary=En mod eller ett bibliotek i paketet kompilerades f\u00F6r en nyare Java-version \u00E4n den k\u00F6rmilj\u00F6 som anv\u00E4nds just nu{0}. P\u00E5 sidan Hantera k\u00F6rmilj\u00F6er kan du installera eller v\u00E4lja en annan Java-version.{1}
crash.javaVersion.targetSuffix=\ (moden kr\u00E4ver Java {0})
crash.javaVersion.title=Java-versionen matchar inte
crash.jeiRei.summaryCollision=Ett recept-ID krockade mellan tv\u00E5 mods \u2013 oftast n\u00E4r tv\u00E5 mods registrerar samma receptidentifierare, eller n\u00E4r en mod f\u00F6r recepthantering (JEI / REI / CraftTweaker) l\u00E4ser in recept snabbare \u00E4n de underliggande modsen publicerar dem. Att ta bort en av modsen f\u00F6r recepthantering brukar l\u00F6sa problemet.
crash.jeiRei.summaryDual=B\u00E5de Just Enough Items (JEI) och Roughly Enough Items (REI) \u00E4r installerade. De registrerar samma krokar f\u00F6r receptvisning och en av dem misslyckas vid varje start. V\u00E4lj en \u2013 de flesta moderna paket anv\u00E4nder REI med Fabric och JEI med Forge.
