settings.fxml.whenOnYour=N\u00E4r detta \u00E4r p\u00E5 lyser dina enheter medan du \u00E4r i startprogrammets menyer, i det aktiva temats accentf\u00E4rg. N\u00E4r du \u00F6ppnar ett modpakets detaljvy v\u00E4xlar f\u00E4rgerna till de som h\u00E4mtats fr\u00E5n modpaketet. N\u00E4r det \u00E4r av f\u00F6rblir enheterna sl\u00E4ckta mellan spelstarterna.
settings.fxml.animationStyle=Animationsstil
settings.fxml.solidSingleSteady=Fast: en enda stadig f\u00E4rg. Andning: l\u00E5ngsam in- och uttoning (standard). Puls: snabbare pulsering mellan accentf\u00E4rgen och dess komplementf\u00E4rg. Cykel: mjuk slinga genom 3\u20134 f\u00E4rger \u2013 h\u00E4mtade fr\u00E5n modpaketets logotyp n\u00E4r ett paket \u00E4r i fokus, annars n\u00E4rliggande nyanser kring temats accentf\u00E4rg. Regnb\u00E5ge: kontinuerligt svep genom hela f\u00E4rgspektrumet, oberoende av paket.
