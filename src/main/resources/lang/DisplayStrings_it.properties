crash.audio.summary=Minecraft non \u00E8 riuscito a inizializzare il sottosistema audio. Su Linux di solito si tratta di un'incompatibilit\u00E0 tra PulseAudio e ALSA (soprattutto nei container o nelle installazioni nuove); su Windows \u00E8 in genere un dispositivo di uscita disattivato o scollegato. Come soluzione alternativa, puoi anche disattivare Musica e suoni nel gioco.
crash.audio.title=Inizializzazione dell'audio non riuscita
crash.auth.summary=Il gioco ha rifiutato il token di sessione fornito dal launcher. Di solito l'accesso salvato \u00E8 scaduto: disconnettersi dal launcher e accedere di nuovo risolve il problema.
crash.auth.title=Minecraft non \u00E8 riuscito ad autenticarsi
crash.diskFull.summary=Lo spazio su disco si \u00E8 esaurito durante l'avvio. Libera un po' di spazio (i mondi dei modpack, i vecchi screenshot e i report dei crash nella cartella di installazione del modpack sono di solito i maggiori responsabili) e riprova.
crash.diskFull.title=Disco pieno
crash.fileLock.summary=Un file che il gioco ha tentato di scrivere era bloccato da un altro processo. Su Windows \u00E8 quasi sempre un antivirus (o Windows Defender) che sta scansionando la mod o il runtime scaricato: prova ad aggiungere la cartella di installazione del launcher alle esclusioni, poi riprova l'avvio. L'altra soluzione comune \u00E8 chiudere OneDrive o altri client di sincronizzazione che puntano alla cartella di installazione.
crash.fileLock.title=File bloccato da un altro processo
crash.forgeDep.summary=La mod "{0}" richiede che sia installato {1} {2}, ma non \u00E8 caricata una versione compatibile. Aggiungi la dipendenza mancante, aggiorna quella esistente a una versione corrispondente oppure rimuovi la mod che la richiede.
crash.forgeDep.title=Dipendenza di una mod mancante o incompatibile
crash.gpu.summary=Minecraft non \u00E8 riuscito a inizializzare il livello grafico. Le cause pi\u00F9 comuni sono driver della GPU non aggiornati, la scelta della GPU sbagliata su un portatile con grafica sia integrata sia dedicata, o sessioni di desktop remoto in cui OpenGL non \u00E8 accelerato.
crash.gpu.title=Inizializzazione della grafica non riuscita
crash.javaVersion.manifestSuffix=\ La versione di Java richiesta \u00E8 normalmente dichiarata dal manifest del modpack.
crash.javaVersion.summary=Una mod o libreria di questo modpack \u00E8 stata compilata per una versione di Java pi\u00F9 recente del runtime attualmente in uso{0}. La schermata Gestione runtime del launcher pu\u00F2 installare o selezionare un Java diverso.{1}
crash.javaVersion.targetSuffix=\ (questa mod richiede Java {0})
crash.javaVersion.title=Versione di Java non corrispondente
crash.jeiRei.summaryCollision=Un ID di ricetta \u00E8 in conflitto tra due mod: in genere quando due mod registrano lo stesso identificatore di ricetta o quando una mod di gestione delle ricette (JEI / REI / CraftTweaker) carica le ricette prima che le mod sottostanti le pubblichino. Rimuovere una delle mod di gestione delle ricette di solito sblocca l'avvio.
crash.jeiRei.summaryDual=Sono installati sia Just Enough Items (JEI) sia Roughly Enough Items (REI). Registrano gli stessi hook del visualizzatore di ricette e uno dei due fallir\u00E0 a ogni avvio. Scegline uno: la maggior parte dei modpack moderni usa REI su Fabric e JEI su Forge.
crash.jeiRei.titleCollision=Conflitto di ID di ricetta
crash.jeiRei.titleDual=Conflitto tra JEI e REI
crash.mixin.culpritSuffix=\ \u2014 il mixin di "{0}" sembra essere il responsabile
crash.mixin.summary=Non \u00E8 stato possibile applicare la patch mixin di una mod{0}. Di solito significa che due mod cercano di modificare la stessa classe o che una delle due non supporta ancora questa versione di Minecraft.
crash.mixin.title=Conflitto di mixin tra mod
crash.modLoading.summaryGeneric=Forge non \u00E8 riuscito a caricare correttamente le mod di questo modpack. Le cause pi\u00F9 comuni sono una dipendenza mancante, una mod pensata per una versione diversa di Minecraft / Forge, o due mod incompatibili tra loro.
crash.modLoading.summaryWithClass=Una mod ha cercato di usare la classe "{0}", ma non \u00E8 stata trovata. Di solito significa che manca una mod richiesta come dipendenza o che si \u00E8 infilata una mod di una versione diversa di Minecraft / Forge.
crash.modLoading.title=Caricamento delle mod non riuscito
crash.modMcMismatch.summary=Una mod di questo modpack \u00E8 stata creata per Minecraft {0}, ma il modpack avvia Minecraft {1}. Riporta il modpack alla versione precedente di Minecraft, sostituisci la mod con una creata per {1} oppure rimuovila.
crash.modMcMismatch.title=Mod creata per Minecraft {0}, il modpack usa {1}
crash.nativeLib.summary=La JVM non \u00E8 riuscita a caricare una delle librerie native di Minecraft (in genere LWJGL o un binding JNI). Le cause pi\u00F9 comuni sono un antivirus che mette il file in quarantena, un'installazione danneggiata o, su Linux, una libreria di sistema mancante. Di solito la reinstallazione del modpack risolve il problema.
crash.nativeLib.title=Impossibile caricare una libreria nativa
crash.oom.detailSuffix=\ ({0})
crash.oom.increaseRam=Aumenta la RAM massima a {0} GB
crash.oom.openRamSettings=Apri le impostazioni della RAM
crash.oom.summary=Minecraft ha esaurito la memoria{0}. La RAM massima del launcher \u00E8 attualmente {1} GB; questo modpack ne richiede di pi\u00F9.
crash.oom.systemTotal=\ Il tuo sistema ha circa {0} GB in totale.
crash.oom.title=Memoria esaurita
crash.optifineSodium.summary=Sono installati sia OptiFine sia Sodium. Modificano le stesse parti interne del rendering di Minecraft in modi incompatibili e non possono coesistere in sicurezza: scegline uno. Sodium richiede il loader Fabric; OptiFine funziona su Forge o con il bridge OptiFabric. I pulsanti Disabilita qui sotto rinominano uno dei due jar in {name}.jar.disabled, cos\u00EC il loader lo ignora al prossimo avvio.
crash.optifineSodium.title=OptiFine e Sodium sono incompatibili
crash.unknown.summary=Non \u00E8 stato possibile identificare una causa specifica dal report del crash. Codice di uscita {0}. Consulta il report completo qui sotto per i dettagli; la riga che inizia con "Caused by:" \u00E8 di solito il punto di partenza pi\u00F9 utile.
crash.unknown.title=Minecraft \u00E8 andato in crash
crash.world.summary=Minecraft si \u00E8 bloccato su un file di salvataggio: un chunk, una regione o il file level.dat non \u00E8 leggibile. Cause comuni: un riavvio imprevisto durante un salvataggio precedente, due mod che scrivono dati NBT in conflitto, o una mod rimossa tra una sessione e l'altra i cui dati sono ancora su disco. Prova a caricare un altro mondo o ripristina un backup recente.
crash.world.title=Impossibile leggere i dati del mondo
