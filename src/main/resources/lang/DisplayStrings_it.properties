settings.fxml.modernMinecraftVersions=Le versioni moderne di Minecraft usano le distribuzioni ufficiali del runtime Java di Mojang. Il Forge legacy (Minecraft 1.12.2 e precedenti) usa Bell-SW Liberica JRE 8 per compatibilit\u00E0.
