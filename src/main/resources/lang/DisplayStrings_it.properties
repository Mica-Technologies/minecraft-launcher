modal.advanced.alwaysVerify.hint=Se disattivato (predefinito), il launcher non ricalcola l'hash dei file che non sono cambiati dall'ultima verifica riuscita, rendendo gli avvii successivi molto pi\u00F9 veloci. Attivalo se hai avuto problemi con file danneggiati o vuoi un controllo di integrit\u00E0 rigoroso ogni volta.
