settings.fxml.minecraftIsA=Minecraft \u00E8 un marchio di Mojang Synergies AB e Microsoft Corporation. Questo launcher usa il nome Minecraft al solo scopo di identificare il gioco che avvia e non \u00E8 affiliato, sostenuto, sponsorizzato o specificamente approvato da Mojang AB o Microsoft.
