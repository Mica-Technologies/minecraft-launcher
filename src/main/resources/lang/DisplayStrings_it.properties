modal.advanced.scanFreq.label=Frequenza della scansione di sicurezza
modal.advanced.scanFreq.hint=Con quale frequenza eseguire la scansione antimalware prima di avviare questo modpack. "Usa l'impostazione predefinita globale" segue quanto impostato in Impostazioni \u2192 Avanzate. Disattivala solo se ti fidi della fonte: la scansione \u00E8 l'ultima linea di difesa del launcher contro le mod manomesse.
modal.advanced.verifyNow=Verifica ora questo modpack
modal.advanced.verifyNow.hint=Ricalcola l'hash di ogni mod, libreria e risorsa e lo confronta con il manifest del modpack. Ripara tutto ci\u00F2 che \u00E8 danneggiato. Richiede da pochi secondi a un paio di minuti a seconda delle dimensioni del modpack.
modal.advanced.removeOfficial.hint=Questo modpack \u00E8 gi\u00E0 esportato nel Minecraft Launcher ufficiale. Rimuovendolo da qui vengono eliminati il profilo e la directory di gioco esportata; la tua installazione Mica non viene toccata.
modal.advanced.addOfficial.hint=Crea un profilo nel Minecraft Launcher ufficiale che punta alle mod e alle configurazioni di questo modpack (le versioni vanilla ricevono solo una voce di profilo, senza copia). I modpack con mod possono installare automaticamente il mod loader corrispondente durante l'esportazione.
modal.ack.heading=Risultati della scansione approvati
modal.ack.intro=Il manutentore del modpack ha contrassegnato questi specifici risultati della scansione come noti e sicuri, cos\u00EC il launcher non si blocca a causa loro. La scansione viene comunque eseguita su ogni file: vengono ignorate solo le combinazioni elencate (file + regola + posizione), e un aggiornamento della mod che cambia il contenuto del file invalida automaticamente la voce.
