settings.fxml.discordIntegration=Integrazione con Discord
settings.fxml.showWhatYou=Mostra a cosa stai giocando nel tuo profilo Discord. Richiede che l'app desktop di Discord sia in esecuzione sullo stesso computer: il launcher comunica con essa in locale tramite IPC, senza token n\u00E9 accesso.
settings.fxml.friendInvites=Inviti agli amici
settings.fxml.allowDiscordInvites=Consenti inviti Discord
settings.fxml.whenEnabledFriends=Se abilitato, gli amici che vedono il tuo stato Discord mentre giochi trovano sul tuo profilo un pulsante "Partecipa" che installa e avvia automaticamente lo stesso modpack sul loro computer. Disattiva solo il pulsante di partecipazione: la Rich Presence \u00E8 controllata dall'interruttore qui sopra.
settings.fxml.youCanAlso=Puoi anche fare clic con il pulsante destro su qualsiasi scheda di modpack nel menu principale e scegliere "Copia link di invito Discord" per condividere l'URL di partecipazione in qualsiasi chat.
settings.fxml.rgbLighting=Illuminazione RGB
settings.fxml.lightingBackend=Backend di illuminazione
settings.fxml.enableRgbLighting=Abilita l'illuminazione RGB
settings.fxml.whenEnabledThe=Se abilitata, il launcher illumina la tastiera supportata con i colori del modpack durante il gioco. Disattivata per impostazione predefinita: attivala solo se vuoi che il launcher comunichi con le tue periferiche.
settings.fxml.backend=Backend:
settings.fxml.disabled=Disattivato
settings.fxml.autoRunsEvery=Auto usa tutti i backend abilitati qui sotto per cui \u00E8 disponibile hardware, cos\u00EC una configurazione mista (ad es. ventole Razer + una tastiera con Illuminazione dinamica di Windows) si illumina tutta insieme. Scegli invece un backend specifico per usare solo quello.
settings.fxml.autoModeIntegrations=Integrazioni in modalit\u00E0 automatica:
settings.fxml.openrgb=OpenRGB
settings.fxml.razerChromaNative=Razer Chroma (SDK nativo)
settings.fxml.windowsDynamicLighting=Illuminazione dinamica di Windows
settings.fxml.corsairIcue=Corsair iCUE
settings.fxml.asusAuraLegacy=ASUS Aura (SDK legacy)
settings.fxml.razerChromaRest=Razer Chroma (REST \u2014 legacy)
settings.fxml.turnOffThe=Disattiva le integrazioni che non vuoi che il launcher contatti, anche se il relativo software \u00E8 installato. Chroma REST \u00E8 disattivato per impostazione predefinita perch\u00E9 l'SDK nativo lo sostituisce in qualsiasi installazione funzionante di Synapse.
settings.fxml.menuEffect=Effetto del menu
settings.fxml.lightUpDevices=Illumina i dispositivi nei menu
settings.fxml.whenOnYour=Se attivo, i dispositivi si illuminano mentre sei nei menu del launcher, con il colore d'accento del tema attivo. Aprendo i dettagli di un modpack si passa ai colori campionati da quel modpack. Se disattivo, i dispositivi restano spenti tra un avvio e l'altro.
settings.fxml.animationStyle=Stile di animazione
settings.fxml.solidSingleSteady=Fisso: un solo colore costante. Respiro: dissolvenza lenta in entrata e in uscita (predefinito). Pulsazione: pulsazione pi\u00F9 rapida tra il colore d'accento e il suo complementare. Ciclo: passaggio fluido tra 3-4 colori, campionati dal logo del modpack quando un modpack \u00E8 in primo piano, altrimenti tonalit\u00E0 analoghe al colore d'accento del tema. Arcobaleno: scorrimento continuo su tutto lo spettro, indipendente dal modpack.
settings.fxml.inGameEffects=Effetti in gioco
settings.fxml.useModpackColors=Usa i colori del modpack
settings.fxml.lightUpThe=Illumina la tastiera con i colori campionati dal logo del modpack in esecuzione. Se disattivo, gli effetti usano la tavolozza d'accento del tema del launcher.
settings.fxml.highlightMinecraftKeys=Evidenzia i tasti di Minecraft
settings.fxml.overlayWasdE=Evidenzia WASD / E / Q / F / Spazio / Maiusc / Ctrl con un colore d'accento a contrasto sullo sfondo con i colori del modpack, cos\u00EC i tasti di gioco risaltano a colpo d'occhio.
settings.fxml.test=Test
settings.fxml.flashesSolidMagenta=Fa lampeggiare un magenta fisso (RGB 255, 0, 255) su ogni dispositivo collegato per 2 secondi, poi ripristina l'effetto precedente. Un lampo costante e alla massima luminosit\u00E0 conferma che il backend raggiunge l'hardware. Nota per Razer Chroma: Chroma Connect inoltra i fotogrammi ai dispositivi di terze parti (ventole del case, strisce LED, ecc.) solo quando \u00E8 collegato anche un dispositivo Razer principale (tastiera, mouse o tappetino). Se solo quei dispositivi di terze parti sfarfallano o restano spenti, collega una tastiera/un mouse Razer e riprova. Uno sfarfallio con un dispositivo principale collegato di solito indica che un'altra app RGB (Synapse, iCUE, Signal RGB) si contende il dispositivo.
