settings.fxml.securityScanFrequency=Frequenza della scansione di sicurezza
settings.fxml.howOftenThe=Con quale frequenza viene eseguita la scansione antimalware prima dell'avvio. Si consiglia Ogni giorno: rileva subito le modifiche al manifest e altrimenti viene eseguita al massimo una volta al giorno, cos\u00EC gli avvii restano rapidi. I singoli modpack possono ignorare questa impostazione nella loro sezione Avanzate.
settings.fxml.gameFileIntegrity=Integrit\u00E0 dei file di gioco
settings.fxml.reHashesEvery=Ricalcola l'hash di ogni mod, libreria e risorsa di ogni modpack installato e lo confronta con il relativo manifest. Ripara tutto ci\u00F2 che \u00E8 danneggiato. Richiede qualche secondo per modpack: con librerie grandi pu\u00F2 durare un paio di minuti in totale.
settings.fxml.verifyAllGame=Verifica tutti i file di gioco
settings.fxml.thirdPartyIntegrations=Integrazioni di terze parti
settings.fxml.curseforgeCoreApi=Chiave API CurseForge Core. Necessaria per importare i modpack di CurseForge tramite URL. Puoi ottenerne una su console.curseforge.com \u2192 My API Keys. Viene conservata crittografata su questo computer con lo stesso schema che protegge il token di accesso di Minecraft: non lascia mai il launcher in chiaro.
