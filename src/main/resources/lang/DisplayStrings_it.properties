settings.fxml.whenLwjglArm=Quando la patch LWJGL ARM \u00E8 abilitata, il launcher sostituisce le librerie native LWJGL2 e jinput x86_64 fornite con Minecraft 1.12.2 e precedenti con binari ARM64 compilati dalla community. Grazie ai manutentori di questi progetti:
