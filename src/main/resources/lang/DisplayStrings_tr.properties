crash.modLoading.summaryGeneric=Forge bu paketin modlar\u0131n\u0131 temiz bir \u015Fekilde y\u00FCkleyemedi. En yayg\u0131n nedenler eksik bir ba\u011F\u0131ml\u0131l\u0131k, farkl\u0131 bir Minecraft/Forge s\u00FCr\u00FCm\u00FCn\u00FC hedefleyen bir mod veya anla\u015Famayan iki moddur.
crash.modLoading.summaryWithClass=Bir mod "{0}" s\u0131n\u0131f\u0131n\u0131 kullanmaya \u00E7al\u0131\u015Ft\u0131 ancak s\u0131n\u0131f bulunamad\u0131. Bu genellikle gerekli bir ba\u011F\u0131ml\u0131l\u0131k modunun eksik oldu\u011Fu ya da farkl\u0131 bir Minecraft / Forge s\u00FCr\u00FCm\u00FCne ait bir modun pakete kar\u0131\u015Ft\u0131\u011F\u0131 anlam\u0131na gelir.
