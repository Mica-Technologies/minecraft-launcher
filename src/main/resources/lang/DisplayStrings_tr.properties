preview.technic.note=Technic'in API'si programl\u0131 eri\u015Fim i\u00E7in kimli\u011Fi do\u011Frulanm\u0131\u015F bir istemci gerektirdi\u011Finden bu ba\u015Flat\u0131c\u0131 hen\u00FCz paketleri do\u011Frudan Technic Platform'dan i\u00E7e aktaram\u0131yor. Ge\u00E7ici \u00E7\u00F6z\u00FCm:
preview.technic.step1=1. A\u015Fa\u011F\u0131daki proje sayfas\u0131n\u0131 a\u00E7\u0131n.
preview.technic.step2=2. Paketin sayfas\u0131nda "Server Download" ba\u011Flant\u0131s\u0131n\u0131 bulun ve sunucu ZIP'ini indirin.
preview.technic.step3=3. Bu ba\u015Flat\u0131c\u0131ya d\u00F6n\u00FCp G\u00F6z At ekran\u0131nda "ZIP \u0130\u00E7e Aktar" d\u00FC\u011Fmesine t\u0131klay\u0131n ve indirilen ZIP'i se\u00E7in. Ba\u015Flat\u0131c\u0131 Technic sunucu paketi bi\u00E7imini tan\u0131r ve sizin i\u00E7in kurar.
