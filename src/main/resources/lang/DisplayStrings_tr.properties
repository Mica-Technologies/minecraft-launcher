crash.optifineSodium.summary=Hem OptiFine hem de Sodium y\u00FCkl\u00FC. \u0130kisi de Minecraft'\u0131n ayn\u0131 i\u015Fleme i\u00E7 yap\u0131lar\u0131n\u0131 uyumsuz bi\u00E7imlerde yamalar ve g\u00FCvenle bir arada \u00E7al\u0131\u015Famaz \u2014 birini se\u00E7in. Sodium, Fabric y\u00FCkleyicisine ihtiya\u00E7 duyar; OptiFine, Forge'da veya OptiFabric k\u00F6pr\u00FCs\u00FCyle \u00E7al\u0131\u015F\u0131r. A\u015Fa\u011F\u0131daki Devre D\u0131\u015F\u0131 B\u0131rak d\u00FC\u011Fmeleri iki jar dosyas\u0131ndan birini {name}.jar.disabled olarak yeniden adland\u0131r\u0131r; b\u00F6ylece y\u00FCkleyici bir sonraki ba\u015Flatmada onu atlar.
