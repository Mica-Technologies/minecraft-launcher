crash.diskFull.summary=Ba\u015Flatma s\u0131ras\u0131nda sistemin disk alan\u0131 t\u00FCkendi. Biraz yer a\u00E7\u0131n \u2014 en \u00E7ok yer kaplayanlar genellikle mod paketi d\u00FCnyalar\u0131, eski ekran g\u00F6r\u00FCnt\u00FCleri ve paketin kurulum klas\u00F6r\u00FCndeki \u00E7\u00F6kme raporlar\u0131d\u0131r \u2014 ve tekrar deneyin.
crash.diskFull.title=Disk dolu
crash.fileLock.summary=Oyunun yazmaya \u00E7al\u0131\u015Ft\u0131\u011F\u0131 bir dosya ba\u015Fka bir i\u015Flem taraf\u0131ndan kilitlenmi\u015F. Windows'ta bunun nedeni neredeyse her zaman, indirilen modu veya \u00E7al\u0131\u015Fma ortam\u0131n\u0131 tarayan bir antivir\u00FCs (veya Windows Defender) yaz\u0131l\u0131m\u0131d\u0131r; ba\u015Flat\u0131c\u0131n\u0131n kurulum klas\u00F6r\u00FCn\u00FC istisna listesine eklemeyi deneyin, ard\u0131ndan ba\u015Flatmay\u0131 yeniden deneyin. Kurulum klas\u00F6r\u00FCn\u00FC izleyen OneDrive / e\u015Fitleme istemcilerini kapatmak da yayg\u0131n bir di\u011Fer \u00E7\u00F6z\u00FCmd\u00FCr.
