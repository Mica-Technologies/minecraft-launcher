crash.jeiRei.summaryCollision=\u0130ki mod aras\u0131nda tarif kimli\u011Fi \u00E7ak\u0131\u015Fmas\u0131 olu\u015Ftu \u2014 genellikle iki mod ayn\u0131 tarif tan\u0131mlay\u0131c\u0131s\u0131n\u0131 kaydetti\u011Finde veya bir tarif y\u00F6netimi modu (JEI / REI / CraftTweaker) tarifleri, as\u0131l modlar yay\u0131mlamadan \u00F6nce y\u00FCkledi\u011Finde olur. Tarif y\u00F6netimi modlar\u0131ndan birini kald\u0131rmak genellikle ba\u015Flatman\u0131n \u00F6n\u00FCn\u00FC a\u00E7ar.
crash.jeiRei.summaryDual=Hem Just Enough Items (JEI) hem de Roughly Enough Items (REI) y\u00FCkl\u00FC. \u0130kisi ayn\u0131 tarif g\u00F6r\u00FCnt\u00FCleyici kancalar\u0131n\u0131 kaydeder ve biri her ba\u015Flatmada ba\u015Far\u0131s\u0131z olur. Birini se\u00E7in \u2014 g\u00FCncel paketlerin \u00E7o\u011Fu Fabric'te REI, Forge'da JEI kullan\u0131r.
