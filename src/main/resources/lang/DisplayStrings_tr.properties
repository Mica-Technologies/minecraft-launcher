crash.modMcMismatch.summary=Bu paketteki bir mod Minecraft {0} i\u00E7in derlenmi\u015F ancak paket Minecraft {1} s\u00FCr\u00FCm\u00FCn\u00FC ba\u015Flat\u0131yor. Paketin Minecraft s\u00FCr\u00FCm\u00FCn\u00FC d\u00FC\u015F\u00FCr\u00FCn, modu {1} i\u00E7in derlenmi\u015F bir s\u00FCr\u00FCm\u00FCyle de\u011Fi\u015Ftirin veya kald\u0131r\u0131n.
