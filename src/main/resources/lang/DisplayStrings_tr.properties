crash.audio.summary=Minecraft ses alt sistemini ba\u015Flatamad\u0131. Linux'ta bu genellikle bir PulseAudio \u2194 ALSA uyumsuzlu\u011Fudur (\u00F6zellikle kapsay\u0131c\u0131larda veya yeni kurulumlarda); Windows'ta bu genellikle devre d\u0131\u015F\u0131 b\u0131rak\u0131lm\u0131\u015F/ba\u011Flant\u0131s\u0131 kesilmi\u015F bir \u00E7\u0131k\u0131\u015F ayg\u0131t\u0131d\u0131r. Ge\u00E7ici bir \u00E7\u00F6z\u00FCm olarak M\u00FCzik ve Sesler oyun i\u00E7inden de kapat\u0131labilir.
