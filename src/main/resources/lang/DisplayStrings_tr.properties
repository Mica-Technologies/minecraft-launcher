preview.curseforge.note=CurseForge, programl\u0131 indirmeler i\u00E7in bir API anahtar\u0131 gerektirdi\u011Finden ba\u015Flat\u0131c\u0131 hen\u00FCz paketlerini do\u011Frudan i\u00E7e aktaram\u0131yor. \u015Eimdilik a\u015Fa\u011F\u0131daki proje sayfas\u0131n\u0131 a\u00E7abilir, mod paketi ZIP'ini CurseForge'dan indirebilir ve bunu bir Mica manifesti olarak yeniden paketleyebilir ya da CurseForge i\u00E7e aktarma deste\u011Fi ekleyecek bir sonraki ba\u015Flat\u0131c\u0131 g\u00FCncellemesini bekleyebilirsiniz.
