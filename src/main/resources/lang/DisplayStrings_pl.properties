settings.fxml.autoRunsEvery=Tryb automatyczny uruchamia ka\u017Cdy w\u0142\u0105czony poni\u017Cej backend, dla kt\u00F3rego dost\u0119pny jest sprz\u0119t, wi\u0119c mieszany zestaw (np. wentylatory Razer + klawiatura z Windows Dynamic Lighting) pod\u015Bwietla si\u0119 w ca\u0142o\u015Bci naraz. Wybierz konkretny backend, aby wymusi\u0107 tylko jego.
settings.fxml.autoModeIntegrations=Integracje w trybie automatycznym:
