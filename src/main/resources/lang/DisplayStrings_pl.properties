settings.fxml.whenEnabledFriends=Po w\u0142\u0105czeniu znajomi, kt\u00F3rzy widz\u0105 Tw\u00F3j status na Discordzie, gdy jeste\u015B w grze, zobacz\u0105 na Twoim profilu przycisk "Do\u0142\u0105cz do gry", kt\u00F3ry automatycznie instaluje i uruchamia ten sam modpack na ich komputerze. Wy\u0142\u0105cza tylko przycisk do\u0142\u0105czania \u2014 samym Rich Presence steruje prze\u0142\u0105cznik powy\u017Cej.
settings.fxml.youCanAlso=Mo\u017Cesz te\u017C klikn\u0105\u0107 prawym przyciskiem myszy dowoln\u0105 kart\u0119 modpacka w menu g\u0142\u00F3wnym i wybra\u0107 "Kopiuj link zaproszenia Discord", aby udost\u0119pni\u0107 adres URL do\u0142\u0105czenia bezpo\u015Brednio na dowolnym czacie.
