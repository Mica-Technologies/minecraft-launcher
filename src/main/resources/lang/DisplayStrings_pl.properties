modal.advanced.alwaysVerify.hint=Gdy opcja jest wy\u0142\u0105czona (domy\u015Blnie), launcher pomija ponowne obliczanie hashy plik\u00F3w, kt\u00F3re nie zmieni\u0142y si\u0119 od ostatniej udanej weryfikacji, dzi\u0119ki czemu kolejne uruchomienia s\u0105 wyra\u017Anie szybsze. W\u0142\u0105cz j\u0105, je\u015Bli mia\u0142e\u015B problemy z uszkodzonymi plikami lub chcesz za ka\u017Cdym razem przeprowadza\u0107 \u015Bcis\u0142e sprawdzenie integralno\u015Bci.
