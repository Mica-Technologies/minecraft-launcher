settings.fxml.curseforgeCoreApi=Klucz API CurseForge Core. Wymagany do importowania modpack\u00F3w CurseForge z adresu URL. Uzyskasz go na console.curseforge.com \u2192 My API Keys. Jest przechowywany w postaci zaszyfrowanej na tym komputerze t\u0105 sam\u0105 metod\u0105, kt\u00F3ra chroni Tw\u00F3j token logowania do Minecrafta \u2014 nigdy nie opuszcza launchera w postaci zwyk\u0142ego tekstu.
