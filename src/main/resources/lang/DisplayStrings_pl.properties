settings.fxml.reHashesEvery=Ponownie oblicza hash ka\u017Cdego moda, biblioteki i zasobu we wszystkich zainstalowanych modpackach i por\u00F3wnuje go z manifestem. Naprawia wszystko, co jest uszkodzone. Trwa kilka sekund na modpack \u2014 przy du\u017Cych bibliotekach \u0142\u0105cznie mo\u017Ce to potrwa\u0107 kilka minut.
