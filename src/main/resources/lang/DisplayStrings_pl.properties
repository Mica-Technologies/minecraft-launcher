settings.fxml.asusAuraLegacy=ASUS Aura (starszy SDK)
settings.fxml.razerChromaRest=Razer Chroma (REST \u2014 starsza wersja)
settings.fxml.turnOffThe=Wy\u0142\u0105cz integracje, z kt\u00F3rymi launcher ma si\u0119 nie \u0142\u0105czy\u0107, nawet je\u015Bli ich oprogramowanie jest zainstalowane. Chroma REST jest domy\u015Blnie wy\u0142\u0105czone, poniewa\u017C natywny SDK zast\u0119puje je w ka\u017Cdej dzia\u0142aj\u0105cej instalacji Synapse.
settings.fxml.menuEffect=Efekt menu
settings.fxml.lightUpDevices=Pod\u015Bwietlaj urz\u0105dzenia w menu
settings.fxml.whenOnYour=Po w\u0142\u0105czeniu urz\u0105dzenia \u015Bwiec\u0105, gdy jeste\u015B w menu launchera, w kolorze akcentu aktywnego motywu. Otwarcie widoku szczeg\u00F3\u0142\u00F3w modpacka prze\u0142\u0105cza na kolory pobrane z tego modpacka. Po wy\u0142\u0105czeniu urz\u0105dzenia pozostaj\u0105 ciemne mi\u0119dzy uruchomieniami gry.
settings.fxml.animationStyle=Styl animacji
settings.fxml.solidSingleSteady=Sta\u0142y: jeden niezmienny kolor. Oddech: powolne rozja\u015Bnianie i przygaszanie (domy\u015Blnie). Puls: szybsze pulsowanie mi\u0119dzy akcentem a kolorem dope\u0142niaj\u0105cym. Cykl: p\u0142ynna p\u0119tla przez 3\u20134 kolory \u2014 pobrane z logo modpacka, gdy modpack jest wybrany, a w przeciwnym razie odcienie pokrewne akcentowi motywu. T\u0119cza: ci\u0105g\u0142e przej\u015Bcie przez ca\u0142e spektrum barw, niezale\u017Cne od modpacka.
settings.fxml.inGameEffects=Efekty w grze
settings.fxml.useModpackColors=U\u017Cywaj kolor\u00F3w modpacka
settings.fxml.lightUpThe=Pod\u015Bwietlaj klawiatur\u0119 kolorami pobranymi z logo uruchomionego modpacka. Po wy\u0142\u0105czeniu efekty u\u017Cywaj\u0105 palety akcent\u00F3w motywu launchera.
settings.fxml.highlightMinecraftKeys=Wyr\u00F3\u017Cniaj klawisze Minecrafta
settings.fxml.overlayWasdE=Nak\u0142ada WASD / E / Q / F / Spacj\u0119 / Shift / Ctrl w kontrastowym kolorze akcentu na t\u0142o w kolorach modpacka, aby klawisze u\u017Cywane w grze by\u0142y widoczne na pierwszy rzut oka.
settings.fxml.test=Test
settings.fxml.flashesSolidMagenta=Przez 2 sekundy wy\u015Bwietla jednolity kolor magenta (RGB 255, 0, 255) na ka\u017Cdym pod\u0142\u0105czonym urz\u0105dzeniu, a nast\u0119pnie przywraca poprzedni efekt. Sta\u0142y b\u0142ysk o pe\u0142nej jasno\u015Bci potwierdza, \u017Ce backend \u0142\u0105czy si\u0119 z Twoim sprz\u0119tem. Uwaga dotycz\u0105ca Razer Chroma: Chroma Connect przekazuje klatki do urz\u0105dze\u0144 innych firm (wentylatory, paski LED itp.) tylko wtedy, gdy pod\u0142\u0105czone jest te\u017C g\u0142\u00F3wne urz\u0105dzenie Razer \u2014 klawiatura, mysz lub podk\u0142adka. Je\u015Bli migocz\u0105 lub pozostaj\u0105 ciemne tylko urz\u0105dzenia innych firm, pod\u0142\u0105cz klawiatur\u0119/mysz Razer i spr\u00F3buj ponownie. Migotanie przy pod\u0142\u0105czonym urz\u0105dzeniu g\u0142\u00F3wnym oznacza zwykle, \u017Ce inna aplikacja RGB (Synapse, iCUE, Signal RGB) rywalizuje o urz\u0105dzenie.
