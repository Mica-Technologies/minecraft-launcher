settings.fxml.showWhatYou=Pokazuj na profilu Discord, w co grasz. Wymaga uruchomionej aplikacji Discord na tym samym komputerze \u2014 launcher komunikuje si\u0119 z ni\u0105 lokalnie przez IPC, bez tokena ani logowania.
