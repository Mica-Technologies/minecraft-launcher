crash.audio.summary=Minecraft nie m\u00F3g\u0142 zainicjowa\u0107 podsystemu d\u017Awi\u0119ku. W systemie Linux zwykle jest to niezgodno\u015B\u0107 PulseAudio \u2194 ALSA (zw\u0142aszcza w kontenerach lub na \u015Bwie\u017Cych instalacjach); w systemie Windows zazwyczaj jest to wy\u0142\u0105czone lub od\u0142\u0105czone urz\u0105dzenie wyj\u015Bciowe. Jako obej\u015Bcie mo\u017Cna te\u017C wy\u0142\u0105czy\u0107 muzyk\u0119 i d\u017Awi\u0119ki w grze.
crash.audio.title=Inicjalizacja d\u017Awi\u0119ku nie powiod\u0142a si\u0119
crash.auth.summary=Gra odrzuci\u0142a token sesji przekazany przez launcher. Zwykle oznacza to, \u017Ce zapisane logowanie wygas\u0142o; wylogowanie si\u0119 z launchera i ponowne zalogowanie rozwi\u0105zuje problem.
crash.auth.title=Minecraft nie m\u00F3g\u0142 si\u0119 uwierzytelni\u0107
crash.diskFull.summary=Podczas uruchamiania zabrak\u0142o miejsca na dysku. Zwolnij troch\u0119 miejsca \u2014 najwi\u0119cej zajmuj\u0105 zwykle \u015Bwiaty modpack\u00F3w, stare zrzuty ekranu i raporty o awariach w folderze instalacyjnym modpacka \u2014 i spr\u00F3buj ponownie.
crash.diskFull.title=Brak miejsca na dysku
crash.fileLock.summary=Plik, kt\u00F3ry gra pr\u00F3bowa\u0142a zapisa\u0107, by\u0142 zablokowany przez inny proces. W systemie Windows prawie zawsze jest to program antywirusowy (lub Windows Defender) skanuj\u0105cy pobrany mod lub \u015Brodowisko wykonawcze \u2014 dodaj folder instalacyjny launchera do wyj\u0105tk\u00F3w, a nast\u0119pnie pon\u00F3w uruchomienie. Innym cz\u0119stym rozwi\u0105zaniem jest zamkni\u0119cie OneDrive / klient\u00F3w synchronizacji obejmuj\u0105cych folder instalacyjny.
crash.fileLock.title=Plik zablokowany przez inny proces
crash.forgeDep.summary=Mod \u201E{0}\u201D wymaga zainstalowania {1} {2}, ale zgodna wersja nie zosta\u0142a wczytana. Dodaj brakuj\u0105c\u0105 zale\u017Cno\u015B\u0107, zaktualizuj istniej\u0105c\u0105 do pasuj\u0105cej wersji lub usu\u0144 mod, kt\u00F3ry jej wymaga.
crash.forgeDep.title=Brakuj\u0105ca lub niezgodna zale\u017Cno\u015B\u0107 moda
crash.gpu.summary=Minecraft nie m\u00F3g\u0142 zainicjowa\u0107 warstwy graficznej. Typowe przyczyny to nieaktualne sterowniki karty graficznej, wyb\u00F3r niew\u0142a\u015Bciwego GPU na laptopie z grafik\u0105 zintegrowan\u0105 i dedykowan\u0105 lub sesje pulpitu zdalnego, w kt\u00F3rych OpenGL nie jest akcelerowany sprz\u0119towo.
crash.gpu.title=Inicjalizacja grafiki nie powiod\u0142a si\u0119
crash.javaVersion.manifestSuffix=\ Wymagana wersja Javy jest zwykle okre\u015Blona w manife\u015Bcie modpacka.
crash.javaVersion.summary=Mod lub biblioteka w tym modpacku zosta\u0142a skompilowana dla nowszej wersji Javy ni\u017C obecnie u\u017Cywane \u015Brodowisko wykonawcze{0}. Na ekranie zarz\u0105dzania \u015Brodowiskami wykonawczymi launchera mo\u017Cna zainstalowa\u0107 lub wybra\u0107 inn\u0105 wersj\u0119 Javy.{1}
crash.javaVersion.targetSuffix=\ (ten mod wymaga Javy {0})
crash.javaVersion.title=Niezgodna wersja Javy
crash.jeiRei.summaryCollision=Dosz\u0142o do kolizji identyfikatora receptury mi\u0119dzy dwoma modami \u2014 zwykle gdy dwa mody rejestruj\u0105 ten sam identyfikator receptury lub gdy mod do zarz\u0105dzania recepturami (JEI / REI / CraftTweaker) wczytuje receptury szybciej, ni\u017C publikuj\u0105 je bazowe mody. Usuni\u0119cie jednego z mod\u00F3w do zarz\u0105dzania recepturami zwykle umo\u017Cliwia uruchomienie.
crash.jeiRei.summaryDual=Zainstalowane s\u0105 jednocze\u015Bnie Just Enough Items (JEI) i Roughly Enough Items (REI). Rejestruj\u0105 te same punkty zaczepienia przegl\u0105darki receptur, wi\u0119c jeden z nich zawiedzie przy ka\u017Cdym uruchomieniu. Wybierz jeden \u2014 wi\u0119kszo\u015B\u0107 nowoczesnych modpack\u00F3w u\u017Cywa REI na Fabric i JEI na Forge.
crash.jeiRei.titleCollision=Kolizja identyfikator\u00F3w receptur
crash.jeiRei.titleDual=Konflikt JEI i REI
crash.mixin.culpritSuffix=\ \u2014 przyczyn\u0105 wydaje si\u0119 mixin z \u201E{0}\u201D
crash.mixin.summary=Nie uda\u0142o si\u0119 zastosowa\u0107 \u0142atki mixin jednego z mod\u00F3w{0}. Zwykle oznacza to, \u017Ce dwa mody pr\u00F3buj\u0105 zmodyfikowa\u0107 t\u0119 sam\u0105 klas\u0119 lub jeden z nich nie obs\u0142uguje jeszcze tej wersji Minecrafta.
crash.mixin.title=Konflikt mixin\u00F3w mod\u00F3w
crash.modLoading.summaryGeneric=Forge nie m\u00F3g\u0142 poprawnie wczyta\u0107 mod\u00F3w tego modpacka. Najcz\u0119stsze przyczyny to brakuj\u0105ca zale\u017Cno\u015B\u0107, mod przeznaczony dla innej wersji Minecrafta / Forge lub dwa mody, kt\u00F3re ze sob\u0105 nie wsp\u00F3\u0142pracuj\u0105.
crash.modLoading.summaryWithClass=Mod pr\u00F3bowa\u0142 u\u017Cy\u0107 klasy \u201E{0}\u201D, ale jej nie znaleziono. Zwykle oznacza to, \u017Ce brakuje wymaganego moda zale\u017Cno\u015Bci lub trafi\u0142 tu mod z innej wersji Minecrafta / Forge.
crash.modLoading.title=Wczytywanie mod\u00F3w nie powiod\u0142o si\u0119
crash.modMcMismatch.summary=Mod w tym modpacku zosta\u0142 zbudowany dla Minecrafta {0}, ale modpack uruchamia Minecraft {1}. Obni\u017C wersj\u0119 Minecrafta w modpacku, zast\u0105p mod wersj\u0105 zbudowan\u0105 dla {1} albo go usu\u0144.
crash.modMcMismatch.title=Mod dla Minecrafta {0}, modpack u\u017Cywa {1}
crash.nativeLib.summary=JVM nie mog\u0142a wczyta\u0107 jednej z natywnych bibliotek Minecrafta (zwykle LWJGL lub powi\u0105zania JNI). Typowe przyczyny to program antywirusowy, kt\u00F3ry przeni\u00F3s\u0142 plik do kwarantanny, uszkodzona instalacja lub \u2014 w systemie Linux \u2014 brakuj\u0105ca biblioteka systemowa. Zwykle pomaga ponowna instalacja modpacka.
crash.nativeLib.title=Nie uda\u0142o si\u0119 wczyta\u0107 biblioteki natywnej
crash.oom.detailSuffix=\ ({0})
crash.oom.increaseRam=Zwi\u0119ksz maksymaln\u0105 ilo\u015B\u0107 RAM do {0} GB
crash.oom.openRamSettings=Otw\u00F3rz ustawienia pami\u0119ci RAM
crash.oom.summary=Minecraftowi zabrak\u0142o pami\u0119ci{0}. Maksymalna ilo\u015B\u0107 pami\u0119ci RAM ustawiona w launcherze wynosi obecnie {1} GB; ten modpack potrzebuje wi\u0119cej.
crash.oom.systemTotal=\ Tw\u00F3j system ma \u0142\u0105cznie oko\u0142o {0} GB.
crash.oom.title=Brak pami\u0119ci
crash.optifineSodium.summary=Zainstalowane s\u0105 jednocze\u015Bnie OptiFine i Sodium. Modyfikuj\u0105 one te same wewn\u0119trzne mechanizmy renderowania Minecrafta w niezgodny spos\u00F3b i nie mog\u0105 bezpiecznie dzia\u0142a\u0107 razem \u2014 wybierz jeden. Sodium wymaga loadera Fabric; OptiFine dzia\u0142a na Forge lub z mostkiem OptiFabric. Poni\u017Csze przyciski Wy\u0142\u0105cz zmieniaj\u0105 nazw\u0119 jednego z dw\u00F3ch plik\u00F3w jar na {name}.jar.disabled, aby loader pomin\u0105\u0142 go przy nast\u0119pnym uruchomieniu.
crash.optifineSodium.title=OptiFine i Sodium s\u0105 niezgodne
crash.unknown.summary=Nie uda\u0142o si\u0119 ustali\u0107 konkretnej przyczyny na podstawie raportu o awarii. Kod wyj\u015Bcia {0}. Szczeg\u00F3\u0142y znajdziesz w pe\u0142nym raporcie poni\u017Cej; najlepiej zacz\u0105\u0107 od wiersza rozpoczynaj\u0105cego si\u0119 od \u201ECaused by:\u201D.
crash.unknown.title=Minecraft uleg\u0142 awarii
crash.world.summary=Minecraft nie poradzi\u0142 sobie z plikiem zapisu \u2014 chunk, region lub level.dat nie daj\u0105 si\u0119 odczyta\u0107. Typowe przyczyny: nieoczekiwany restart podczas poprzedniego zapisu, dwa mody zapisuj\u0105ce sprzeczne dane NBT lub mod usuni\u0119ty mi\u0119dzy sesjami, kt\u00F3rego dane nadal s\u0105 na dysku. Spr\u00F3buj wczyta\u0107 inny \u015Bwiat lub przywr\u00F3\u0107 go z ostatniej kopii zapasowej.
crash.world.title=Nie uda\u0142o si\u0119 odczyta\u0107 danych \u015Bwiata
