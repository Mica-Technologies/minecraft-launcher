preview.technic.sourceLabel=\u0179r\u00F3d\u0142o: Technic
preview.technic.note=API Technic wymaga uwierzytelnionego klienta do dost\u0119pu programowego, wi\u0119c ten launcher nie mo\u017Ce jeszcze importowa\u0107 modpack\u00F3w bezpo\u015Brednio z Technic Platform. Obej\u015Bcie:
preview.technic.step1=1. Otw\u00F3rz poni\u017Csz\u0105 stron\u0119 projektu.
preview.technic.step2=2. Na stronie modpacka znajd\u017A link \u201EServer Download\u201D i pobierz plik ZIP serwera.
preview.technic.step3=3. Wr\u00F3\u0107 do launchera, kliknij \u201EImportuj ZIP\u201D na ekranie Przegl\u0105daj i wybierz pobrany plik ZIP. Launcher rozpozna format paczki serwerowej Technic i wszystko skonfiguruje.
