settings.fxml.whenEnabledThe=Po w\u0142\u0105czeniu launcher pod\u015Bwietla obs\u0142ugiwan\u0105 klawiatur\u0119 kolorami modpacka podczas gry. Domy\u015Blnie wy\u0142\u0105czone \u2014 w\u0142\u0105cz tylko wtedy, gdy chcesz, aby launcher komunikowa\u0142 si\u0119 z Twoimi urz\u0105dzeniami peryferyjnymi.
