settings.fxml.minecraftIsA=Minecraft jest znakiem towarowym firm Mojang Synergies AB i Microsoft Corporation. Ten launcher u\u017Cywa nazwy Minecraft wy\u0142\u0105cznie do identyfikacji uruchamianej gry i nie jest powi\u0105zany z firmami Mojang AB ani Microsoft, ani przez nie wspierany, sponsorowany czy specjalnie zatwierdzony.
