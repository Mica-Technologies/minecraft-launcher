modal.advanced.scanFreq.hint=Jak cz\u0119sto wykonywa\u0107 skanowanie w poszukiwaniu z\u0142o\u015Bliwego oprogramowania przed uruchomieniem tego modpacka. Opcja \u201EU\u017Cyj globalnej warto\u015Bci domy\u015Blnej\u201D stosuje to, co ustawiono w Ustawienia \u2192 Zaawansowane. Wy\u0142\u0105czaj tylko wtedy, gdy ufasz \u017Ar\u00F3d\u0142u \u2014 skanowanie to ostatnia linia obrony launchera przed zmodyfikowanymi z\u0142o\u015Bliwie modami.
modal.advanced.verifyNow=Zweryfikuj teraz ten modpack
modal.advanced.verifyNow.hint=Ponownie oblicza hash ka\u017Cdego moda, biblioteki i zasobu i por\u00F3wnuje go z manifestem modpacka. Naprawia wszystko, co jest uszkodzone. Trwa od kilku sekund do kilku minut, zale\u017Cnie od rozmiaru modpacka.
modal.advanced.removeOfficial.hint=Ten modpack zosta\u0142 ju\u017C wyeksportowany do oficjalnego Minecraft Launcher. Usuni\u0119cie tutaj usuwa profil i wyeksportowany katalog gry; Twoja instalacja w Mica pozostaje nienaruszona.
modal.advanced.addOfficial.hint=Tworzy w oficjalnym Minecraft Launcher profil wskazuj\u0105cy na mody i konfiguracje tego modpacka (wersje vanilla otrzymuj\u0105 tylko wpis profilu \u2014 kopiowanie nie jest potrzebne). W przypadku modpack\u00F3w z modami podczas eksportu mo\u017Cna automatycznie zainstalowa\u0107 odpowiedni loader mod\u00F3w.
modal.ack.heading=Potwierdzone wyniki skanowania
modal.ack.intro=Opiekun modpacka oznaczy\u0142 te konkretne wyniki skanowania jako znane i bezpieczne, wi\u0119c launcher nie blokuje z ich powodu uruchomienia. Skanowanie nadal obejmuje ka\u017Cdy plik \u2014 wyciszane s\u0105 tylko wymienione kombinacje (plik + regu\u0142a + lokalizacja), a aktualizacja moda zmieniaj\u0105ca zawarto\u015B\u0107 pliku automatycznie uniewa\u017Cnia wpis.
