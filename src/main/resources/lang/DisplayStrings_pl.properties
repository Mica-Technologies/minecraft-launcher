settings.fxml.howOftenThe=Jak cz\u0119sto przed uruchomieniem gry wykonywane jest skanowanie w poszukiwaniu z\u0142o\u015Bliwego oprogramowania. Zalecana opcja to Codziennie \u2014 natychmiast wychwytuje zmiany w manife\u015Bcie, a poza tym skanuje najwy\u017Cej raz dziennie, dzi\u0119ki czemu uruchamianie jest szybkie. Poszczeg\u00F3lne modpacki mog\u0105 to zmieni\u0107 w swojej sekcji Zaawansowane.
