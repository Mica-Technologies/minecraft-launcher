preview.curseforge.note=CurseForge wymaga klucza API do automatycznego pobierania, wi\u0119c launcher nie mo\u017Ce jeszcze bezpo\u015Brednio importowa\u0107 modpack\u00F3w z tego serwisu. Na razie mo\u017Cesz otworzy\u0107 poni\u017Csz\u0105 stron\u0119 projektu, pobra\u0107 plik ZIP modpacka z CurseForge i przepakowa\u0107 go jako manifest Mica albo poczeka\u0107 na kolejn\u0105 aktualizacj\u0119 launchera, kt\u00F3ra doda obs\u0142ug\u0119 importu z CurseForge.
