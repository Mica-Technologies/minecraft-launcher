settings.fxml.whenOnYour=Wenn aktiviert, leuchten Ihre Ger\u00E4te, w\u00E4hrend Sie sich in den Launcher-Men\u00FCs befinden, in der Akzentfarbe des aktiven Designs. Beim \u00D6ffnen der Detailansicht eines Modpacks wird zu den aus diesem Modpack entnommenen Farben gewechselt. Wenn deaktiviert, bleiben die Ger\u00E4te zwischen Spielstarts dunkel.
settings.fxml.animationStyle=Animationsstil
settings.fxml.solidSingleSteady=Statisch: eine gleichbleibende Farbe. Atmen: langsames Ein- und Ausblenden (Standard). Puls: schnelleres Pulsieren zwischen der Akzentfarbe und ihrer Komplement\u00E4rfarbe. Zyklus: flie\u00DFender Wechsel durch 3\u20134 Farben \u2013 aus dem Modpack-Logo entnommen, wenn ein Modpack im Fokus ist, sonst benachbarte Farbt\u00F6ne um die Akzentfarbe des Designs. Regenbogen: kontinuierlicher Durchlauf durch das gesamte Farbspektrum, unabh\u00E4ngig vom Modpack.
settings.fxml.inGameEffects=Effekte im Spiel
settings.fxml.useModpackColors=Modpack-Farben verwenden
settings.fxml.lightUpThe=Beleuchtet die Tastatur in Farben aus dem Logo des laufenden Modpacks. Wenn deaktiviert, verwenden Effekte die Akzentpalette des Launcher-Designs.
settings.fxml.highlightMinecraftKeys=Minecraft-Tasten hervorheben
settings.fxml.overlayWasdE=Hebt WASD / E / Q / F / Leertaste / Umschalt / Strg in einer kontrastierenden Akzentfarbe \u00FCber dem Modpack-Farbhintergrund hervor, damit die Spieltasten auf einen Blick erkennbar sind.
settings.fxml.test=Testen
settings.fxml.flashesSolidMagenta=L\u00E4sst alle verbundenen Ger\u00E4te 2 Sekunden lang durchgehend magenta (RGB 255, 0, 255) leuchten und stellt dann den vorherigen Effekt wieder her. Ein gleichm\u00E4\u00DFiges Leuchten in voller Helligkeit best\u00E4tigt, dass das Backend Ihre Hardware erreicht. Hinweis f\u00FCr Razer Chroma: Chroma Connect leitet Frames nur an Ger\u00E4te von Drittanbietern (Geh\u00E4usel\u00FCfter, LED-Streifen usw.) weiter, wenn auch ein prim\u00E4res Razer-Ger\u00E4t \u2013 Tastatur, Maus oder Mauspad \u2013 angeschlossen ist. Wenn nur diese Drittanbieterger\u00E4te flackern oder dunkel bleiben, schlie\u00DFen Sie eine Razer-Tastatur/-Maus an und versuchen Sie es erneut. Flackern trotz angeschlossenem prim\u00E4rem Ger\u00E4t bedeutet meist, dass eine andere RGB-App (Synapse, iCUE, Signal RGB) um das Ger\u00E4t konkurriert.
