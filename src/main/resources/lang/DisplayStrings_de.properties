modal.advanced.alwaysVerify.hint=Wenn deaktiviert (Standard), \u00FCberspringt der Launcher das erneute Hashen von Dateien, die sich seit der letzten erfolgreichen \u00DCberpr\u00FCfung nicht ge\u00E4ndert haben \u2013 dadurch werden nachfolgende Starts sp\u00FCrbar schneller. Aktivieren Sie diese Option, wenn Sie Probleme mit besch\u00E4digten Dateien hatten oder jedes Mal eine strenge Integrit\u00E4tspr\u00FCfung w\u00FCnschen.
