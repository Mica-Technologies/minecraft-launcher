preview.curseforge.note=CurseForge erfordert einen API-Schl\u00FCssel f\u00FCr automatisierte Downloads, daher kann der Launcher Modpacks von dort noch nicht direkt importieren. Vorerst k\u00F6nnen Sie die Projektseite unten \u00F6ffnen, die Modpack-ZIP von CurseForge herunterladen und sie entweder als Mica-Manifest neu verpacken oder auf das n\u00E4chste Launcher-Update mit CurseForge-Import warten.
