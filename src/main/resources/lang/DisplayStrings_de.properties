modal.advanced.scanFreq.hint=Wie oft der Malware-Scan vor dem Start dieses Modpacks ausgef\u00FChrt wird. \u201EGlobale Standardeinstellung verwenden\u201C \u00FCbernimmt Ihre Auswahl unter Einstellungen \u2192 Erweitert. Deaktivieren Sie den Scan nur, wenn Sie der Quelle vertrauen \u2013 er ist die letzte Verteidigungslinie des Launchers gegen manipulierte Mods.
