quickStart.welcome.heading=Willkommen beim Mica Minecraft Launcher
quickStart.welcome.subtitle=Eine kurze Einrichtung, damit sich der Launcher von Anfang an richtig anf\u00FChlt. W\u00E4hlen Sie ein Design, passen Sie die Speicherzuweisung an und legen Sie einige Einstellungen fest \u2013 all das k\u00F6nnen Sie sp\u00E4ter in den Einstellungen \u00E4ndern.
