modal.advanced.removeOfficial.hint=Dieses Modpack wurde bereits in den offiziellen Minecraft Launcher exportiert. Durch Entfernen werden das Profil und das exportierte Spielverzeichnis gel\u00F6scht; Ihre Mica-Installation bleibt unber\u00FChrt.
modal.advanced.addOfficial.hint=Erstellt in Ihrem offiziellen Minecraft Launcher ein Profil, das auf die Mods und Konfigurationen dieses Modpacks verweist (Vanilla-Versionen erhalten nur einen Profileintrag \u2013 keine Kopie n\u00F6tig). Modpacks mit Mod-Loader k\u00F6nnen den passenden Modloader beim Export automatisch installieren.
modal.ack.heading=Best\u00E4tigte Scan-Funde
modal.ack.intro=Der Maintainer des Modpacks hat diese Scan-Funde als unbedenklich markiert, damit der Launcher deswegen nicht blockiert. Der Scan l\u00E4uft weiterhin \u00FCber jede Datei \u2013 nur die aufgef\u00FChrten Kombinationen (Datei + Regel + Fundstelle) werden ignoriert, und ein Mod-Update, das den Inhalt der Datei \u00E4ndert, macht den Eintrag automatisch ung\u00FCltig.
modal.ack.noReason=(kein Grund vom Maintainer des Modpacks angegeben)
