settings.fxml.whenEnabledFriends=Wenn aktiviert, sehen Freunde, die Ihren Discord-Status sehen, w\u00E4hrend Sie spielen, in Ihrem Profil eine Schaltfl\u00E4che \u201EJoin Game\u201C, die dasselbe Modpack auf ihrem Computer automatisch installiert und startet. Deaktiviert nur die Beitreten-Schaltfl\u00E4che \u2013 Rich Presence selbst wird \u00FCber den Schalter oben gesteuert.
settings.fxml.youCanAlso=Sie k\u00F6nnen auch mit der rechten Maustaste auf eine Modpack-Karte auf der Startseite klicken und \u201EDiscord-Einladungslink kopieren\u201C w\u00E4hlen, um die Beitritts-URL direkt in einem beliebigen Chat zu teilen.
