preview.technic.note=Die API von Technic erfordert f\u00FCr den automatisierten Zugriff einen authentifizierten Client, daher kann dieser Launcher Modpacks noch nicht direkt von der Technic Platform importieren. So umgehen Sie das:
preview.technic.step1=1. \u00D6ffnen Sie die Projektseite unten.
preview.technic.step2=2. Suchen Sie auf der Seite des Modpacks nach dem Link \u201EServer Download\u201C und laden Sie die Server-ZIP herunter.
preview.technic.step3=3. Klicken Sie zur\u00FCck in diesem Launcher im Bildschirm \u201EDurchsuchen\u201C auf \u201EZIP importieren\u201C und w\u00E4hlen Sie die heruntergeladene ZIP aus. Der Launcher erkennt das Technic-Serverpack-Format und richtet es f\u00FCr Sie ein.
