crash.audio.summary=Minecraft konnte das Audiosystem nicht initialisieren. Unter Linux liegt das meist an einem Konflikt zwischen PulseAudio und ALSA (besonders in Containern oder bei Neuinstallationen); unter Windows ist meist ein deaktiviertes oder getrenntes Ausgabeger\u00E4t die Ursache. Als Notl\u00F6sung k\u00F6nnen Musik und Ger\u00E4usche auch im Spiel deaktiviert werden.
crash.audio.title=Audioinitialisierung fehlgeschlagen
crash.auth.summary=Das Spiel hat das vom Launcher \u00FCbergebene Sitzungstoken abgelehnt. Meist ist die gespeicherte Anmeldung abgelaufen; Abmelden im Launcher und erneutes Anmelden behebt das Problem.
crash.auth.title=Minecraft konnte sich nicht authentifizieren
crash.diskFull.summary=Dem System ist w\u00E4hrend des Starts der Speicherplatz ausgegangen. Geben Sie Speicherplatz frei \u2013 Modpack-Welten, alte Screenshots und Absturzberichte im Installationsordner des Modpacks sind meist die gr\u00F6\u00DFten Platzfresser \u2013 und versuchen Sie es erneut.
crash.diskFull.title=Datentr\u00E4ger voll
crash.fileLock.summary=Eine Datei, die das Spiel schreiben wollte, war durch einen anderen Prozess gesperrt. Unter Windows ist das fast immer ein Virenscanner (oder Windows Defender), der den heruntergeladenen Mod oder die Laufzeitumgebung pr\u00FCft \u2013 f\u00FCgen Sie den Installationsordner des Launchers zu den Ausnahmen hinzu und starten Sie erneut. Die andere h\u00E4ufige L\u00F6sung: OneDrive bzw. Synchronisierungsprogramme schlie\u00DFen, die auf den Installationsordner zugreifen.
crash.fileLock.title=Datei durch einen anderen Prozess gesperrt
crash.forgeDep.summary=Der Mod \u201E{0}\u201C ben\u00F6tigt {1} {2}, aber es ist keine kompatible Version geladen. F\u00FCgen Sie die fehlende Abh\u00E4ngigkeit hinzu, aktualisieren Sie die vorhandene auf eine passende Version oder entfernen Sie den Mod, der sie ben\u00F6tigt.
crash.forgeDep.title=Fehlende oder nicht \u00FCbereinstimmende Mod-Abh\u00E4ngigkeit
crash.gpu.summary=Minecraft konnte die Grafikschicht nicht initialisieren. H\u00E4ufige Ursachen sind veraltete Grafiktreiber, die Auswahl der falschen GPU auf einem Laptop mit integrierter und dedizierter Grafik oder Remotedesktop-Sitzungen, in denen OpenGL nicht beschleunigt wird.
crash.gpu.title=Grafikinitialisierung fehlgeschlagen
crash.javaVersion.manifestSuffix=\ Die erforderliche Java-Version wird normalerweise im Modpack-Manifest festgelegt.
crash.javaVersion.summary=Ein Mod oder eine Bibliothek in diesem Modpack wurde f\u00FCr eine neuere Java-Version kompiliert als die aktuell verwendete Laufzeitumgebung{0}. In der Verwaltung der Laufzeitumgebungen des Launchers k\u00F6nnen Sie eine andere Java-Version installieren oder ausw\u00E4hlen.{1}
crash.javaVersion.targetSuffix=\ (dieser Mod setzt Java {0} voraus)
crash.javaVersion.title=Java-Version passt nicht
crash.jeiRei.summaryCollision=Zwei Mods haben dieselbe Rezept-ID verwendet \u2013 typischerweise, wenn zwei Mods dieselbe Rezeptkennung registrieren oder ein Rezeptverwaltungs-Mod (JEI / REI / CraftTweaker) Rezepte schneller l\u00E4dt, als die zugrunde liegenden Mods sie bereitstellen. Das Entfernen eines der Rezeptverwaltungs-Mods erm\u00F6glicht den Start meist wieder.
crash.jeiRei.summaryDual=Sowohl Just Enough Items (JEI) als auch Roughly Enough Items (REI) sind installiert. Beide registrieren dieselben Rezeptanzeige-Hooks, und einer von beiden schl\u00E4gt bei jedem Start fehl. W\u00E4hlen Sie einen aus \u2013 die meisten aktuellen Modpacks verwenden REI mit Fabric und JEI mit Forge.
crash.jeiRei.titleCollision=Kollision von Rezept-IDs
crash.jeiRei.titleDual=Konflikt zwischen JEI und REI
crash.mixin.culpritSuffix=\ \u2013 das Mixin von \u201E{0}\u201C scheint die Ursache zu sein
crash.mixin.summary=Der Mixin-Patch eines Mods konnte nicht angewendet werden{0}. Meist bedeutet das, dass zwei Mods dieselbe Klasse patchen wollen oder einer von ihnen diese Minecraft-Version noch nicht unterst\u00FCtzt.
crash.mixin.title=Mod-Mixin-Konflikt
crash.modLoading.summaryGeneric=Forge konnte die Mods dieses Modpacks nicht fehlerfrei laden. Die h\u00E4ufigsten Ursachen sind eine fehlende Abh\u00E4ngigkeit, ein Mod f\u00FCr eine andere Minecraft-/Forge-Version oder zwei Mods, die nicht miteinander kompatibel sind.
crash.modLoading.summaryWithClass=Ein Mod wollte die Klasse \u201E{0}\u201C verwenden, aber sie wurde nicht gefunden. Meist bedeutet das, dass ein ben\u00F6tigter Abh\u00E4ngigkeits-Mod fehlt oder sich ein Mod f\u00FCr eine andere Minecraft-/Forge-Version eingeschlichen hat.
crash.modLoading.title=Laden der Mods fehlgeschlagen
crash.modMcMismatch.summary=Ein Mod in diesem Modpack wurde f\u00FCr Minecraft {0} erstellt, aber das Modpack startet Minecraft {1}. Stufen Sie entweder die Minecraft-Version des Modpacks herab, ersetzen Sie den Mod durch eine Version f\u00FCr {1} oder entfernen Sie ihn.
crash.modMcMismatch.title=Mod f\u00FCr Minecraft {0}, Modpack nutzt {1}
crash.nativeLib.summary=Die JVM konnte eine der nativen Bibliotheken von Minecraft nicht laden (meist LWJGL oder eine JNI-Anbindung). H\u00E4ufige Ursachen sind ein Virenscanner, der die Datei in Quarant\u00E4ne verschoben hat, eine besch\u00E4digte Installation oder \u2013 unter Linux \u2013 eine fehlende Systembibliothek. Eine Neuinstallation des Modpacks behebt das Problem meist.
crash.nativeLib.title=Eine native Bibliothek konnte nicht geladen werden
crash.oom.detailSuffix=\ ({0})
crash.oom.increaseRam=Maximalen RAM auf {0} GB erh\u00F6hen
crash.oom.openRamSettings=RAM-Einstellungen \u00F6ffnen
crash.oom.summary=Minecraft hatte nicht gen\u00FCgend Arbeitsspeicher{0}. Der maximale RAM im Launcher betr\u00E4gt derzeit {1} GB; dieses Modpack ben\u00F6tigt mehr.
crash.oom.systemTotal=\ Ihr System hat insgesamt etwa {0} GB.
crash.oom.title=Arbeitsspeicher ersch\u00F6pft
crash.optifineSodium.summary=Sowohl OptiFine als auch Sodium sind installiert. Beide ver\u00E4ndern dieselben Rendering-Interna von Minecraft auf inkompatible Weise und k\u00F6nnen nicht zuverl\u00E4ssig nebeneinander laufen \u2013 w\u00E4hlen Sie eines aus. Sodium ben\u00F6tigt den Fabric-Loader; OptiFine funktioniert mit Forge oder \u00FCber die OptiFabric-Br\u00FCcke. Die Schaltfl\u00E4chen \u201EDeaktivieren\u201C unten benennen eine der beiden JAR-Dateien in {name}.jar.disabled um, sodass der Loader sie beim n\u00E4chsten Start \u00FCberspringt.
crash.optifineSodium.title=OptiFine und Sodium sind nicht kompatibel
crash.unknown.summary=Aus dem Absturzbericht lie\u00DF sich keine konkrete Ursache ermitteln. Exit-Code {0}. Details finden Sie im vollst\u00E4ndigen Bericht unten; die Zeile, die mit \u201ECaused by:\u201C beginnt, ist meist der beste Ausgangspunkt.
crash.unknown.title=Minecraft ist abgest\u00FCrzt
crash.world.summary=Minecraft ist an einer Speicherdatei gescheitert \u2013 ein Chunk, eine Region oder die level.dat ist nicht lesbar. H\u00E4ufige Ursachen: ein unerwarteter Neustart w\u00E4hrend eines fr\u00FCheren Speichervorgangs, zwei Mods, die widerspr\u00FCchliche NBT-Daten schreiben, oder ein zwischenzeitlich entfernter Mod, dessen Daten noch auf dem Datentr\u00E4ger liegen. Laden Sie eine andere Welt oder stellen Sie ein aktuelles Backup wieder her.
crash.world.title=Weltdaten konnten nicht gelesen werden
