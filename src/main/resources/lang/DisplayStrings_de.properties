settings.fxml.whenEnabledThe=Wenn aktiviert, beleuchtet der Launcher Ihre unterst\u00FCtzte Tastatur w\u00E4hrend des Spielens in Farben, die vom Modpack abgeleitet sind. Standardm\u00E4\u00DFig deaktiviert \u2013 aktivieren Sie dies nur, wenn der Launcher mit Ihren Peripherieger\u00E4ten kommunizieren soll.
