settings.fxml.autoRunsEvery=\u201EAutomatisch\u201C verwendet jedes unten aktivierte Backend, f\u00FCr das Hardware vorhanden ist, sodass ein gemischtes System (z. B. Razer-L\u00FCfter + eine Tastatur mit Windows Dynamic Lighting) alles gleichzeitig beleuchtet. W\u00E4hlen Sie stattdessen ein bestimmtes Backend, um nur dieses zu verwenden.
