settings.fxml.reHashesEvery=Vuelve a calcular el hash de cada mod, biblioteca y recurso de todos los modpacks instalados y lo compara con su manifiesto. Repara todo lo que est\u00E9 da\u00F1ado. Tarda unos segundos por modpack; con bibliotecas grandes puede tardar un par de minutos en total.
