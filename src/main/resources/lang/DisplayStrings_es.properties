settings.fxml.minecraftTrademark=Marca registrada de Minecraft
settings.fxml.minecraftIsA=Minecraft es una marca comercial de Mojang Synergies AB y Microsoft Corporation. Este launcher usa el nombre de Minecraft \u00FAnicamente para identificar el juego que inicia y no est\u00E1 afiliado, respaldado, patrocinado ni aprobado espec\u00EDficamente por Mojang AB ni por Microsoft.
