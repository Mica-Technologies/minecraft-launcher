settings.fxml.modernMinecraftVersions=Las versiones modernas de Minecraft usan las distribuciones oficiales del entorno de ejecuci\u00F3n de Java de Mojang. Forge heredado (Minecraft 1.12.2 y anteriores) usa Bell-SW Liberica JRE 8 por compatibilidad.
