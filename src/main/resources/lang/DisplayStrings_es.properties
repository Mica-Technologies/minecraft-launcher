tooltip.settings.generateJvmArgs=Genera una cadena de argumentos de JVM ajustada a su CPU, su RAM y su configuraci\u00F3n de heap m\u00E1ximo.
tooltip.main.search=Filtrar modpacks. Cada palabra separada por espacios debe coincidir en alguna parte del nombre, la versi\u00F3n, la versi\u00F3n de Minecraft o la versi\u00F3n de Forge del modpack. Pruebe "1.12", "forge" o "biomes 1.12".
