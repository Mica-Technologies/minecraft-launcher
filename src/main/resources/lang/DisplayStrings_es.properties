settings.fxml.howOftenThe=Con qu\u00E9 frecuencia se ejecuta el an\u00E1lisis de malware antes de iniciar el juego. Se recomienda Diariamente: detecta los cambios del manifiesto de inmediato y, por lo dem\u00E1s, se ejecuta como m\u00E1ximo una vez al d\u00EDa para que el inicio siga siendo r\u00E1pido. Cada modpack puede ignorar este valor en su secci\u00F3n Avanzado.
