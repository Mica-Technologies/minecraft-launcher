settings.fxml.corsairIcue=Corsair iCUE
settings.fxml.asusAuraLegacy=ASUS Aura (SDK heredado)
settings.fxml.razerChromaRest=Razer Chroma (REST, heredado)
settings.fxml.turnOffThe=Desactive las integraciones con las que no quiera que el launcher se comunique, aunque su software est\u00E9 instalado. Chroma REST est\u00E1 desactivado de forma predeterminada, ya que el SDK nativo lo sustituye en cualquier instalaci\u00F3n de Synapse que funcione.
settings.fxml.menuEffect=Efecto de men\u00FA
settings.fxml.lightUpDevices=Iluminar los dispositivos en los men\u00FAs
settings.fxml.whenOnYour=Si est\u00E1 activado, sus dispositivos se iluminan mientras est\u00E1 en los men\u00FAs del launcher, con el color de acento del tema activo. Al abrir la vista de detalles de un modpack, se usan los colores extra\u00EDdos de ese modpack. Si est\u00E1 desactivado, los dispositivos permanecen apagados entre partidas.
settings.fxml.animationStyle=Estilo de animaci\u00F3n
settings.fxml.solidSingleSteady=S\u00F3lido: un \u00FAnico color fijo. Respiraci\u00F3n: aparece y se desvanece lentamente (predeterminado). Pulso: pulso m\u00E1s r\u00E1pido entre el color de acento y su complementario. Ciclo: recorrido suave por 3-4 colores, extra\u00EDdos del logotipo del modpack cuando hay un modpack seleccionado o, si no, tonos an\u00E1logos al acento del tema. Arco\u00EDris: barrido continuo de tonos por todo el espectro, sin depender del modpack.
settings.fxml.inGameEffects=Efectos durante el juego
settings.fxml.useModpackColors=Usar los colores del modpack
settings.fxml.lightUpThe=Ilumina el teclado con colores extra\u00EDdos del logotipo del modpack en ejecuci\u00F3n. Si est\u00E1 desactivado, los efectos usan la paleta de acento del tema del launcher.
settings.fxml.highlightMinecraftKeys=Resaltar las teclas de Minecraft
settings.fxml.overlayWasdE=Resalta WASD / E / Q / F / Espacio / May\u00FAs / Ctrl con un acento de contraste sobre el fondo de color del modpack, para que las teclas de juego se distingan de un vistazo.
settings.fxml.test=Prueba
settings.fxml.flashesSolidMagenta=Hace parpadear un magenta s\u00F3lido (RGB 255, 0, 255) en todos los dispositivos conectados durante 2 segundos y luego restaura el efecto anterior. Un destello estable y con brillo m\u00E1ximo confirma que el backend llega a su hardware. Nota para Razer Chroma: Chroma Connect solo reenv\u00EDa fotogramas a dispositivos de terceros (ventiladores de caja, tiras, etc.) cuando tambi\u00E9n hay conectado un dispositivo Razer principal (teclado, rat\u00F3n o alfombrilla). Si solo esos dispositivos de terceros parpadean o permanecen apagados, conecte un teclado o rat\u00F3n Razer y vuelva a intentarlo. Si parpadea con un dispositivo principal conectado, normalmente significa que otra aplicaci\u00F3n RGB (Synapse, iCUE, Signal RGB) compite por el dispositivo.
settings.fxml.testConnection=Probar conexi\u00F3n
settings.fxml.micaMinecraftLauncher=Mica Minecraft Launcher
