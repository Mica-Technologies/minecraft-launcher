settings.fxml.theLauncherUses=El launcher usa el siguiente software de c\u00F3digo abierto:
settings.fxml.fullLicenseTexts=Los textos completos de las licencias se incluyen con el launcher instalado en la carpeta LICENSES y est\u00E1n disponibles en el repositorio de c\u00F3digo fuente de este proyecto.
