modal.advanced.scanFreq.label=Frecuencia del an\u00E1lisis de seguridad
modal.advanced.scanFreq.hint=Con qu\u00E9 frecuencia se ejecuta el an\u00E1lisis de malware antes de iniciar este modpack. "Usar valor predeterminado global" sigue lo que haya configurado en Configuraci\u00F3n \u2192 Avanzado. Desact\u00EDvelo solo si conf\u00EDa en el origen: el an\u00E1lisis es la \u00FAltima l\u00EDnea de defensa del launcher contra mods manipulados.
modal.advanced.verifyNow=Verificar este modpack ahora
modal.advanced.verifyNow.hint=Vuelve a calcular el hash de cada mod, biblioteca y recurso y lo compara con el manifiesto del modpack. Repara todo lo que est\u00E9 da\u00F1ado. Tarda desde unos segundos hasta un par de minutos, seg\u00FAn el tama\u00F1o del modpack.
modal.advanced.removeOfficial.hint=Este modpack ya se export\u00F3 al Minecraft Launcher oficial. Al quitarlo aqu\u00ED se eliminan el perfil y el directorio de juego exportado; su instalaci\u00F3n de Mica no se ve afectada.
modal.advanced.addOfficial.hint=Crea un perfil en su Minecraft Launcher oficial que apunta a los mods y la configuraci\u00F3n de este modpack (las versiones vanilla solo reciben un perfil, sin necesidad de copiar nada). Los modpacks con mods pueden instalar autom\u00E1ticamente el cargador de mods correspondiente durante la exportaci\u00F3n.
modal.ack.heading=Resultados del an\u00E1lisis aceptados
modal.ack.intro=El responsable del modpack marc\u00F3 estos resultados concretos del an\u00E1lisis como conocidos y seguros para que el launcher no se bloquee por ellos. El an\u00E1lisis se sigue ejecutando en todos los archivos: solo se silencian las combinaciones indicadas (archivo + regla + ubicaci\u00F3n), y una actualizaci\u00F3n de mod que cambie el contenido del archivo invalida autom\u00E1ticamente la entrada.
