settings.fxml.showWhatYou=Muestra a qu\u00E9 est\u00E1 jugando en su perfil de Discord. Requiere que la aplicaci\u00F3n de escritorio de Discord est\u00E9 abierta en el mismo equipo: el launcher se comunica con ella localmente mediante IPC, sin necesidad de token ni de inicio de sesi\u00F3n.
settings.fxml.friendInvites=Invitaciones de amigos
settings.fxml.allowDiscordInvites=Permitir invitaciones de Discord
settings.fxml.whenEnabledFriends=Si est\u00E1 activado, los amigos que vean su estado de Discord mientras juega ver\u00E1n en su perfil un bot\u00F3n \u201CUnirse a la partida\u201D que instala autom\u00E1ticamente e inicia el mismo modpack en su equipo. Solo desactiva el bot\u00F3n de unirse; la Rich Presence en s\u00ED se controla con el interruptor de arriba.
settings.fxml.youCanAlso=Tambi\u00E9n puede hacer clic con el bot\u00F3n derecho en cualquier tarjeta de modpack del men\u00FA principal y elegir \u201CCopiar enlace de invitaci\u00F3n de Discord\u201D para compartir la URL de uni\u00F3n directamente en cualquier chat.
settings.fxml.rgbLighting=Iluminaci\u00F3n RGB
settings.fxml.lightingBackend=Backend de iluminaci\u00F3n
settings.fxml.enableRgbLighting=Habilitar iluminaci\u00F3n RGB
settings.fxml.whenEnabledThe=Si est\u00E1 activado, el launcher ilumina su teclado compatible con colores derivados del modpack mientras juega. Desactivado de forma predeterminada: act\u00EDvelo solo si quiere que el launcher se comunique con sus perif\u00E9ricos.
settings.fxml.backend=Backend:
settings.fxml.disabled=Desactivado
settings.fxml.autoRunsEvery=Autom\u00E1tico ejecuta todos los backends habilitados de abajo que tengan hardware disponible, de modo que un equipo mixto (p. ej., ventiladores Razer + un teclado con Iluminaci\u00F3n din\u00E1mica de Windows) se ilumina todo a la vez. Elija un backend espec\u00EDfico para forzar solo ese.
settings.fxml.autoModeIntegrations=Integraciones en modo autom\u00E1tico:
