settings.fxml.whenLwjglArm=Cuando el parche LWJGL ARM est\u00E1 activado, el launcher reemplaza las bibliotecas nativas x86_64 de LWJGL2 y jinput incluidas con Minecraft 1.12.2 y anteriores por binarios ARM64 compilados por la comunidad. Gracias a los responsables de estos proyectos:
