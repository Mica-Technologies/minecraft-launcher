settings.fxml.checkForLauncher=Buscar actualizaciones del launcher
settings.fxml.whenOffThe=Si est\u00E1 desactivado, el launcher no se conectar\u00E1 a internet al iniciarse ni mostrar\u00E1 el icono de actualizaci\u00F3n disponible en la barra de navegaci\u00F3n.
