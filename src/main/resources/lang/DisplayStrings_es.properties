preview.curseforge.note=CurseForge exige una clave de API para las descargas automatizadas, por lo que el launcher todav\u00EDa no puede importar sus modpacks directamente. Por ahora, puede abrir la p\u00E1gina del proyecto a continuaci\u00F3n, descargar el ZIP del modpack desde CurseForge y volver a empaquetarlo como manifiesto de Mica, o esperar a la pr\u00F3xima actualizaci\u00F3n del launcher que a\u00F1ada la importaci\u00F3n desde CurseForge.
preview.technic.detected=Se detect\u00F3 una URL de modpack de Technic.
preview.technic.sourceLabel=Origen: Technic
preview.technic.note=La API de Technic exige un cliente autenticado para el acceso automatizado, por lo que este launcher todav\u00EDa no puede importar modpacks directamente desde Technic Platform. La soluci\u00F3n alternativa:
preview.technic.step1=1. Abra la p\u00E1gina del proyecto a continuaci\u00F3n.
preview.technic.step2=2. Busque el enlace "Server Download" en la p\u00E1gina del modpack y descargue el ZIP del servidor.
preview.technic.step3=3. De vuelta en este launcher, haga clic en "Importar ZIP" en la pantalla Explorar y elija el ZIP descargado. El launcher reconocer\u00E1 el formato de modpack de servidor de Technic y lo configurar\u00E1 por usted.
