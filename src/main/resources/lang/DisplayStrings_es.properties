crash.audio.summary=Minecraft no pudo inicializar el subsistema de audio. En Linux suele deberse a una incompatibilidad entre PulseAudio y ALSA (sobre todo en contenedores o instalaciones nuevas); en Windows suele ser un dispositivo de salida desactivado o desconectado. Como soluci\u00F3n alternativa, tambi\u00E9n puede desactivar M\u00FAsica y sonidos dentro del juego.
crash.audio.title=Error al inicializar el audio
crash.auth.summary=El juego rechaz\u00F3 el token de sesi\u00F3n que proporcion\u00F3 el launcher. Normalmente se debe a que el inicio de sesi\u00F3n guardado ha caducado; cerrar la sesi\u00F3n en el launcher y volver a iniciarla lo soluciona.
crash.auth.title=Minecraft no pudo autenticarse
crash.diskFull.summary=El sistema se qued\u00F3 sin espacio en disco durante el inicio. Libere espacio (los mundos de los modpacks, las capturas de pantalla antiguas y los informes de fallos de la carpeta de instalaci\u00F3n del modpack suelen ser lo que m\u00E1s ocupa) y vuelva a intentarlo.
crash.diskFull.title=Disco lleno
crash.fileLock.summary=Otro proceso bloque\u00F3 un archivo que el juego intentaba escribir. En Windows casi siempre es un antivirus (o Windows Defender) que analiza el mod o el entorno de ejecuci\u00F3n descargado: a\u00F1ada la carpeta de instalaci\u00F3n del launcher a las exclusiones y vuelva a intentar el inicio. La otra soluci\u00F3n habitual es cerrar OneDrive u otros clientes de sincronizaci\u00F3n que apunten a la carpeta de instalaci\u00F3n.
crash.fileLock.title=Archivo bloqueado por otro proceso
crash.forgeDep.summary=El mod "{0}" necesita {1} {2} instalado, pero no hay cargada ninguna versi\u00F3n compatible. Agregue la dependencia que falta, actualice la existente a una versi\u00F3n compatible o quite el mod que la requiere.
crash.forgeDep.title=Falta una dependencia de mod o su versi\u00F3n no coincide
crash.gpu.summary=Minecraft no pudo inicializar la capa gr\u00E1fica. Las causas habituales son controladores de GPU desactualizados, que se elija la GPU equivocada en un port\u00E1til con gr\u00E1ficos integrados y dedicados, o sesiones de escritorio remoto en las que OpenGL no tiene aceleraci\u00F3n.
crash.gpu.title=Error al inicializar los gr\u00E1ficos
crash.javaVersion.manifestSuffix=\ La versi\u00F3n de Java necesaria suele declararse en el manifiesto del modpack.
crash.javaVersion.summary=Un mod o una biblioteca de este modpack se compil\u00F3 para una versi\u00F3n de Java m\u00E1s reciente que la del entorno de ejecuci\u00F3n que se est\u00E1 usando{0}. La pantalla de gesti\u00F3n de entornos de ejecuci\u00F3n del launcher permite instalar o elegir otro Java.{1}
crash.javaVersion.targetSuffix=\ (este mod requiere Java {0})
crash.javaVersion.title=La versi\u00F3n de Java no coincide
crash.jeiRei.summaryCollision=Hubo una colisi\u00F3n de ID de receta entre dos mods; suele ocurrir cuando dos mods registran el mismo identificador de receta o cuando un mod de gesti\u00F3n de recetas (JEI / REI / CraftTweaker) carga las recetas antes de que los mods subyacentes las publiquen. Quitar uno de los mods de gesti\u00F3n de recetas suele desbloquear el inicio.
crash.jeiRei.summaryDual=Est\u00E1n instalados tanto Just Enough Items (JEI) como Roughly Enough Items (REI). Ambos registran los mismos hooks del visor de recetas y uno de ellos fallar\u00E1 en cada inicio. Elija uno: la mayor\u00EDa de los modpacks modernos usan REI en Fabric y JEI en Forge.
crash.jeiRei.titleCollision=Colisi\u00F3n de ID de receta
crash.jeiRei.titleDual=Conflicto entre JEI y REI
crash.mixin.culpritSuffix=\ \u2014 el mixin de "{0}" parece ser el culpable
crash.mixin.summary=No se pudo aplicar el parche mixin de un mod{0}. Por lo general, esto significa que dos mods est\u00E1n intentando parchear la misma clase o que uno de ellos a\u00FAn no es compatible con esta versi\u00F3n de Minecraft.
crash.mixin.title=Conflicto de mixins entre mods
crash.modLoading.summaryGeneric=Forge no pudo cargar correctamente los mods de este modpack. Las causas m\u00E1s comunes son una dependencia que falta, un mod para otra versi\u00F3n de Minecraft / Forge o dos mods incompatibles entre s\u00ED.
crash.modLoading.summaryWithClass=Un mod intent\u00F3 usar la clase "{0}", pero no se encontr\u00F3. Normalmente significa que falta un mod requerido como dependencia o que se col\u00F3 un mod de otra versi\u00F3n de Minecraft / Forge.
crash.modLoading.title=Error al cargar el mod
crash.modMcMismatch.summary=Un mod de este modpack se compil\u00F3 para Minecraft {0}, pero el modpack inicia Minecraft {1}. Cambie la versi\u00F3n de Minecraft del modpack, sustituya el mod por uno compilado para {1} o qu\u00EDtelo.
crash.modMcMismatch.title=Mod para Minecraft {0}; el modpack usa {1}
crash.nativeLib.summary=La JVM no pudo cargar una de las bibliotecas nativas de Minecraft (normalmente LWJGL o un enlace JNI). Las causas habituales son un antivirus que pone el archivo en cuarentena, una instalaci\u00F3n da\u00F1ada o, en Linux, una biblioteca del sistema que falta. Reinstalar el modpack suele solucionarlo.
crash.nativeLib.title=No se pudo cargar una biblioteca nativa
crash.oom.detailSuffix=\ ({0})
crash.oom.increaseRam=Aumentar la RAM m\u00E1xima a {0} GB
crash.oom.openRamSettings=Abrir configuraci\u00F3n de RAM
crash.oom.summary=Minecraft se qued\u00F3 sin memoria{0}. La RAM m\u00E1xima del launcher es actualmente de {1} GB; este modpack necesita m\u00E1s.
crash.oom.systemTotal=\ Su sistema tiene unos {0} GB en total.
crash.oom.title=Sin memoria
crash.optifineSodium.summary=Est\u00E1n instalados tanto OptiFine como Sodium. Ambos modifican los mismos componentes internos de renderizado de Minecraft de formas incompatibles y no pueden coexistir de forma segura: elija uno. Sodium necesita el cargador Fabric; OptiFine funciona en Forge o con el puente OptiFabric. Los botones Desactivar de abajo cambian el nombre de uno de los dos JAR a {name}.jar.disabled para que el cargador lo omita en el pr\u00F3ximo inicio.
crash.optifineSodium.title=OptiFine y Sodium son incompatibles
crash.unknown.summary=No pudimos identificar una causa concreta en el informe de fallo. C\u00F3digo de salida {0}. Consulte el informe completo a continuaci\u00F3n para ver los detalles; la l\u00EDnea que empieza por "Caused by:" suele ser el mejor punto de partida.
crash.unknown.title=Minecraft fall\u00F3
crash.world.summary=Minecraft no pudo procesar un archivo de guardado: un chunk, una regi\u00F3n o el level.dat no se puede leer. Causas comunes: un reinicio inesperado durante un guardado anterior, dos mods que escriben NBT en conflicto o un mod quitado entre sesiones cuyos datos siguen en el disco. Pruebe a cargar otro mundo o restaure una copia de seguridad reciente.
crash.world.title=No se pudieron leer los datos del mundo
