settings.fxml.curseforgeCoreApi=Clave de la API Core de CurseForge. Necesaria para importar modpacks de CurseForge por URL. Obtenga una en console.curseforge.com \u2192 My API Keys. Se almacena cifrada en este equipo con el mismo m\u00E9todo que protege su token de inicio de sesi\u00F3n de Minecraft: nunca sale del launcher en texto sin cifrar.
