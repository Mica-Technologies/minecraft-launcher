modal.advanced.hint=Controles avanzados para este modpack. Los valores predeterminados sirven para la mayor\u00EDa de los usuarios.
modal.advanced.alwaysVerify=Verificar siempre los archivos del juego al iniciar
modal.advanced.alwaysVerify.hint=Si est\u00E1 desactivado (predeterminado), el launcher no vuelve a calcular el hash de los archivos que no han cambiado desde la \u00FAltima verificaci\u00F3n correcta, lo que agiliza notablemente los inicios posteriores. Act\u00EDvelo si ha tenido problemas con archivos da\u00F1ados o si quiere la comprobaci\u00F3n de integridad estricta cada vez.
