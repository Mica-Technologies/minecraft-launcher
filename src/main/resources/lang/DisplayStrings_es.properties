tooltip.settings.resetLauncher=Elimina todos los datos del launcher y restablece los valores predeterminados. \u00A1\u00DAselo solo como \u00FAltimo recurso!
tooltip.settings.resetRuntime=Elimina todos los entornos de ejecuci\u00F3n de Java almacenados en cach\u00E9. Se volver\u00E1n a descargar en el pr\u00F3ximo inicio.
tooltip.settings.exportSettings=Guarde la configuraci\u00F3n actual del launcher en un archivo JSON para tener una copia de seguridad o compartirla.
