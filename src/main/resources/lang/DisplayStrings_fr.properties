settings.fxml.whenOnYour=Si cette option est activ\u00E9e, vos p\u00E9riph\u00E9riques s'allument quand vous \u00EAtes dans les menus du lanceur, avec la couleur d'accentuation du th\u00E8me actif. Ouvrir la vue d\u00E9taill\u00E9e d'un modpack passe aux couleurs \u00E9chantillonn\u00E9es de ce modpack. Sinon, les p\u00E9riph\u00E9riques restent \u00E9teints entre deux lancements de jeu.
settings.fxml.animationStyle=Style d'animation
settings.fxml.solidSingleSteady=Fixe\u00A0: une seule couleur constante. Respiration\u00A0: fondu lent (par d\u00E9faut). Pulsation\u00A0: pulsation plus rapide entre l'accent et sa couleur compl\u00E9mentaire. Cycle\u00A0: boucle fluide sur 3 ou 4 couleurs, \u00E9chantillonn\u00E9es dans le logo du modpack quand un pack est s\u00E9lectionn\u00E9, sinon des teintes analogues autour de l'accent du th\u00E8me. Arc-en-ciel\u00A0: balayage continu de tout le spectre, ind\u00E9pendant du pack.
settings.fxml.inGameEffects=Effets en jeu
settings.fxml.useModpackColors=Utiliser les couleurs du modpack
settings.fxml.lightUpThe=\u00C9claire le clavier avec des couleurs \u00E9chantillonn\u00E9es dans le logo du modpack en cours d'ex\u00E9cution. Sinon, les effets utilisent la palette d'accentuation du th\u00E8me du lanceur.
settings.fxml.highlightMinecraftKeys=Mettre en \u00E9vidence les touches Minecraft
settings.fxml.overlayWasdE=Superpose WASD / E / Q / F / Espace / Maj / Ctrl dans une couleur contrast\u00E9e sur le fond aux couleurs du modpack, pour rep\u00E9rer d'un coup d'\u0153il les touches de jeu.
settings.fxml.test=Test
settings.fxml.flashesSolidMagenta=Fait clignoter un magenta fixe (RVB 255, 0, 255) sur chaque p\u00E9riph\u00E9rique connect\u00E9 pendant 2 secondes, puis r\u00E9tablit l'effet pr\u00E9c\u00E9dent. Un flash stable \u00E0 pleine luminosit\u00E9 confirme que le backend atteint votre mat\u00E9riel. Remarque pour Razer Chroma\u00A0: Chroma Connect ne transmet les images aux p\u00E9riph\u00E9riques tiers (ventilateurs de bo\u00EEtier, bandes LED, etc.) que si un p\u00E9riph\u00E9rique Razer principal (clavier, souris ou tapis de souris) est \u00E9galement connect\u00E9. Si seuls ces p\u00E9riph\u00E9riques tiers scintillent ou restent \u00E9teints, branchez un clavier ou une souris Razer et r\u00E9essayez. Un scintillement avec un p\u00E9riph\u00E9rique principal pr\u00E9sent signifie g\u00E9n\u00E9ralement qu'une autre application RVB (Synapse, iCUE, Signal RGB) se dispute le p\u00E9riph\u00E9rique.
