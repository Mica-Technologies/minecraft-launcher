tooltip.settings.maxRam=RAM maximale utilisable par Minecraft (Go). Indiquez 4 \u00E0 8 Go pour les gros modpacks.
tooltip.settings.debug=Active la sortie de journalisation d\u00E9taill\u00E9e. Utile pour r\u00E9soudre les probl\u00E8mes.
tooltip.settings.windowResize=Permet de redimensionner librement la fen\u00EAtre du lanceur.
tooltip.settings.discord=Affiche votre modpack actuel et votre statut de jeu dans Discord.
tooltip.settings.discordInvites=Pendant que vous jouez, vos amis voient sur votre statut Discord un bouton \u00AB\u00A0Rejoindre la partie\u00A0\u00BB qui installe et lance le m\u00EAme modpack sur leur ordinateur.
tooltip.settings.enhancedLogging=\u00C9crit des informations de diagnostic suppl\u00E9mentaires dans les fichiers journaux.
tooltip.settings.inGameConsole=Affiche en temps r\u00E9el la sortie du jeu dans une console pendant que vous jouez. Utile pour le d\u00E9bogage.
tooltip.settings.batteryThrottle=Ralentit les t\u00E9l\u00E9chargements sur les portables fonctionnant sur batterie pour \u00E9conomiser l'\u00E9nergie. Les ordinateurs de bureau et les appareils sur secteur ne sont jamais limit\u00E9s.
tooltip.settings.theme=Choisissez le th\u00E8me visuel du lanceur. Automatique correspond aux param\u00E8tres de votre syst\u00E8me d'exploitation.
tooltip.settings.jvmPreset=Options d'optimisation de la JVM. Performance (Aikar's Flags) est recommand\u00E9 pour la plupart des utilisateurs.
tooltip.settings.proxyEnable=Activez cette option si vous \u00EAtes derri\u00E8re un proxy ou un pare-feu d'entreprise ou d'\u00E9tablissement scolaire.
