crash.audio.summary=Minecraft n'a pas pu initialiser le sous-syst\u00E8me audio. Sous Linux, il s'agit g\u00E9n\u00E9ralement d'une incompatibilit\u00E9 PulseAudio \u2194 ALSA (surtout dans des conteneurs ou sur des installations r\u00E9centes)\u00A0; sous Windows, c'est g\u00E9n\u00E9ralement un p\u00E9riph\u00E9rique de sortie d\u00E9sactiv\u00E9 ou d\u00E9connect\u00E9. Pour contourner le probl\u00E8me, vous pouvez aussi d\u00E9sactiver Musique et sons dans le jeu.
crash.audio.title=\u00C9chec de l'initialisation audio
crash.auth.summary=Le jeu a rejet\u00E9 le jeton de session fourni par le lanceur. En g\u00E9n\u00E9ral, la connexion enregistr\u00E9e a expir\u00E9\u00A0; se d\u00E9connecter du lanceur puis se reconnecter r\u00E8gle le probl\u00E8me.
crash.auth.title=Minecraft n'a pas pu s'authentifier
crash.diskFull.summary=Le syst\u00E8me a manqu\u00E9 d'espace disque pendant le lancement. Lib\u00E9rez de l'espace (les mondes des modpacks, les anciennes captures d'\u00E9cran et les rapports de plantage du dossier d'installation du pack sont g\u00E9n\u00E9ralement les plus volumineux), puis r\u00E9essayez.
crash.diskFull.title=Disque plein
crash.fileLock.summary=Un fichier que le jeu tentait d'\u00E9crire \u00E9tait verrouill\u00E9 par un autre processus. Sous Windows, c'est presque toujours un antivirus (ou Windows Defender) qui analyse le mod ou le runtime t\u00E9l\u00E9charg\u00E9\u00A0: ajoutez le dossier d'installation du lanceur aux exclusions, puis relancez. L'autre solution courante consiste \u00E0 fermer OneDrive ou les clients de synchronisation qui pointent vers le dossier d'installation.
crash.fileLock.title=Fichier verrouill\u00E9 par un autre processus
crash.forgeDep.summary=Le mod \u00AB\u00A0{0}\u00A0\u00BB n\u00E9cessite {1} {2}, mais aucune version compatible n'est charg\u00E9e. Ajoutez la d\u00E9pendance manquante, mettez \u00E0 jour la d\u00E9pendance existante vers une version compatible, ou supprimez le mod qui l'exige.
crash.forgeDep.title=D\u00E9pendance de mod manquante ou incompatible
crash.gpu.summary=Minecraft n'a pas pu initialiser la couche graphique. Les causes habituelles sont des pilotes graphiques obsol\u00E8tes, le mauvais GPU s\u00E9lectionn\u00E9 sur un portable dot\u00E9 d'une puce graphique int\u00E9gr\u00E9e et d'une carte d\u00E9di\u00E9e, ou une session de bureau \u00E0 distance o\u00F9 OpenGL n'est pas acc\u00E9l\u00E9r\u00E9.
crash.gpu.title=\u00C9chec de l'initialisation graphique
crash.javaVersion.manifestSuffix=\ La version de Java requise est normalement d\u00E9clar\u00E9e dans le manifeste du modpack.
crash.javaVersion.summary=Un mod ou une biblioth\u00E8que de ce pack a \u00E9t\u00E9 compil\u00E9 pour une version de Java plus r\u00E9cente que le runtime actuellement utilis\u00E9{0}. L'\u00E9cran de gestion des runtimes du lanceur permet d'installer ou de choisir un autre Java.{1}
crash.javaVersion.targetSuffix=\ (ce mod cible Java {0})
crash.javaVersion.title=Incompatibilit\u00E9 de version Java
crash.jeiRei.summaryCollision=Un identifiant de recette est en conflit entre deux mods\u00A0: g\u00E9n\u00E9ralement parce que deux mods enregistrent le m\u00EAme identifiant de recette, ou parce qu'un mod de gestion des recettes (JEI / REI / CraftTweaker) charge les recettes avant que les mods concern\u00E9s ne les publient. Retirer l'un des mods de gestion des recettes d\u00E9bloque g\u00E9n\u00E9ralement le lancement.
crash.jeiRei.summaryDual=Just Enough Items (JEI) et Roughly Enough Items (REI) sont tous deux install\u00E9s. Ils enregistrent les m\u00EAmes hooks d'affichage des recettes et l'un d'eux \u00E9chouera \u00E0 chaque lancement. Choisissez-en un\u00A0: la plupart des packs r\u00E9cents utilisent REI sur Fabric et JEI sur Forge.
crash.jeiRei.titleCollision=Conflit d'identifiant de recette
crash.jeiRei.titleDual=Conflit JEI et REI
crash.mixin.culpritSuffix=\ \u2014 le mixin de \u00AB\u00A0{0}\u00A0\u00BB semble \u00EAtre en cause
crash.mixin.summary=Le patch mixin d'un mod n'a pas pu s'appliquer{0}. Cela signifie g\u00E9n\u00E9ralement que deux mods tentent de patcher la m\u00EAme classe, ou que l'un d'eux ne prend pas encore en charge cette version de Minecraft.
crash.mixin.title=Conflit de mixins entre mods
crash.modLoading.summaryGeneric=Forge n'a pas pu charger correctement les mods de ce pack. Les causes les plus courantes sont une d\u00E9pendance manquante, un mod pr\u00E9vu pour une autre version de Minecraft / Forge, ou deux mods incompatibles entre eux.
crash.modLoading.summaryWithClass=Un mod a tent\u00E9 d'utiliser la classe \u00AB\u00A0{0}\u00A0\u00BB, mais elle est introuvable. Cela signifie g\u00E9n\u00E9ralement qu'un mod requis comme d\u00E9pendance est absent, ou qu'un mod destin\u00E9 \u00E0 une autre version de Minecraft / Forge s'est gliss\u00E9 dans le pack.
crash.modLoading.title=\u00C9chec du chargement des mods
crash.modMcMismatch.summary=Un mod de ce pack a \u00E9t\u00E9 con\u00E7u pour Minecraft {0}, mais le pack lance Minecraft {1}. R\u00E9trogradez la version de Minecraft du pack, remplacez le mod par une version con\u00E7ue pour {1}, ou supprimez-le.
crash.modMcMismatch.title=Mod con\u00E7u pour Minecraft {0}, le pack utilise {1}
crash.nativeLib.summary=La JVM n'a pas pu charger l'une des biblioth\u00E8ques natives de Minecraft (g\u00E9n\u00E9ralement LWJGL ou une liaison JNI). Les causes habituelles sont un antivirus qui a mis le fichier en quarantaine, une installation corrompue ou, sous Linux, une biblioth\u00E8que syst\u00E8me manquante. R\u00E9installer le modpack r\u00E8gle g\u00E9n\u00E9ralement le probl\u00E8me.
crash.nativeLib.title=Impossible de charger une biblioth\u00E8que native
crash.oom.detailSuffix=\ ({0})
crash.oom.increaseRam=Augmenter la RAM maximale \u00E0 {0} Go
crash.oom.openRamSettings=Ouvrir les param\u00E8tres de RAM
crash.oom.summary=Minecraft a manqu\u00E9 de m\u00E9moire{0}. La RAM maximale de votre lanceur est actuellement de {1} Go\u00A0; ce pack a besoin de plus.
crash.oom.systemTotal=\ Votre syst\u00E8me dispose d'environ {0} Go au total.
crash.oom.title=M\u00E9moire insuffisante
crash.optifineSodium.summary=OptiFine et Sodium sont tous deux install\u00E9s. Ils modifient les m\u00EAmes m\u00E9canismes internes de rendu de Minecraft de mani\u00E8re incompatible et ne peuvent pas coexister sans risque\u00A0: choisissez-en un. Sodium n\u00E9cessite le chargeur Fabric\u00A0; OptiFine fonctionne sur Forge ou avec la passerelle OptiFabric. Les boutons D\u00E9sactiver ci-dessous renomment l'un des deux JAR en {name}.jar.disabled pour que le chargeur l'ignore au prochain lancement.
