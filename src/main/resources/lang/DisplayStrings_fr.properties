settings.fxml.whenEnabledFriends=Si cette option est activ\u00E9e, les amis qui voient votre statut Discord pendant que vous jouez obtiennent un bouton \u00AB\u00A0Rejoindre la partie\u00A0\u00BB sur votre profil, qui installe et lance automatiquement le m\u00EAme modpack sur leur ordinateur. Cela ne d\u00E9sactive que le bouton Rejoindre\u00A0: la Rich Presence elle-m\u00EAme d\u00E9pend de l'option ci-dessus.
