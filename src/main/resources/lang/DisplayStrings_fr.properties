modal.updateLog.more=+ {0} entr\u00E9es plus anciennes
modal.advanced.hint=R\u00E9glages avanc\u00E9s propres \u00E0 ce pack. Les valeurs par d\u00E9faut conviennent \u00E0 la plupart des utilisateurs.
modal.advanced.alwaysVerify=Toujours v\u00E9rifier les fichiers du jeu au lancement
modal.advanced.alwaysVerify.hint=Si cette option est d\u00E9sactiv\u00E9e (par d\u00E9faut), le lanceur ne recalcule pas le hash des fichiers inchang\u00E9s depuis la derni\u00E8re v\u00E9rification r\u00E9ussie, ce qui acc\u00E9l\u00E8re nettement les lancements suivants. Activez-la si vous avez rencontr\u00E9 des fichiers corrompus ou si vous voulez un contr\u00F4le d'int\u00E9grit\u00E9 strict \u00E0 chaque fois.
