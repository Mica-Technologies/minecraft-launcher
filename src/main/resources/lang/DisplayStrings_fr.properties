tooltip.settings.proxyPort=Le num\u00E9ro de port du serveur proxy (g\u00E9n\u00E9ralement 8080 pour HTTP, 1080 pour SOCKS).
tooltip.settings.proxyType=HTTP pour les proxys web, SOCKS pour les proxys r\u00E9seau de plus bas niveau.
tooltip.settings.resetLauncher=Supprime toutes les donn\u00E9es du lanceur et r\u00E9tablit les valeurs par d\u00E9faut. \u00C0 n'utiliser qu'en dernier recours\u00A0!
tooltip.settings.resetRuntime=Supprime tous les runtimes Java en cache. Ils seront ret\u00E9l\u00E9charg\u00E9s au prochain lancement.
tooltip.settings.exportSettings=Enregistre les param\u00E8tres actuels du lanceur dans un fichier JSON, pour les sauvegarder ou les partager.
tooltip.settings.importSettings=Charge les param\u00E8tres depuis un fichier JSON export\u00E9 pr\u00E9c\u00E9demment.
tooltip.settings.generateJvmArgs=G\u00E9n\u00E8re des arguments JVM adapt\u00E9s \u00E0 votre processeur, \u00E0 votre RAM et \u00E0 votre r\u00E9glage de tas maximal.
tooltip.main.search=Filtre les packs. Chaque mot s\u00E9par\u00E9 par un espace doit appara\u00EEtre dans le nom, la version, la version de Minecraft ou la version de Forge du pack. Essayez \u00AB\u00A01.12\u00A0\u00BB, \u00AB\u00A0forge\u00A0\u00BB ou \u00AB\u00A0biomes 1.12\u00A0\u00BB.
tooltip.main.typeFilter=Filtrer par modpack ou version Vanilla.
