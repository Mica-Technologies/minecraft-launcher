settings.fxml.turnOffThe=D\u00E9sactivez les int\u00E9grations que le lanceur ne doit pas contacter, m\u00EAme si leur logiciel est install\u00E9. Chroma REST est d\u00E9sactiv\u00E9 par d\u00E9faut, car le SDK natif le remplace sur toute installation fonctionnelle de Synapse.
settings.fxml.menuEffect=Effet de menu
