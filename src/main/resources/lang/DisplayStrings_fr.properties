startup.alreadyRunning.noWindow=Mica Minecraft Launcher est d\u00E9j\u00E0 en cours d'ex\u00E9cution, mais sa fen\u00EAtre ne s'est pas ouverte. Il est peut-\u00EAtre encore en train de d\u00E9marrer. Si aucune fen\u00EAtre n'appara\u00EEt, arr\u00EAtez Mica Minecraft Launcher dans le Gestionnaire des t\u00E2ches (Moniteur d'activit\u00E9 sous macOS), puis relancez-le.
startup.portUnavailable=Mica Minecraft Launcher n'a pas pu d\u00E9marrer, car le port local {0} n'est pas disponible ({1}).\n\nUne autre instance du launcher est peut-\u00EAtre encore en cours de fermeture, ou un autre programme ou une r\u00E9servation de ports Windows utilise ce port. Patientez quelques secondes, puis r\u00E9essayez. Si le probl\u00E8me persiste, red\u00E9marrez votre ordinateur.
tui.fallback.windowed=Aucun terminal interactif d\u00E9tect\u00E9\u00A0: ouverture d'une fen\u00EAtre de terminal s\u00E9par\u00E9e. Lancez-le depuis un vrai terminal (par ex. Terminal.app ou iTerm) pour l'utiliser directement dans le terminal.
