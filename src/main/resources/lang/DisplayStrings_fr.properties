scanFrequency.ON_CHANGES_ONLY=Uniquement en cas de modification
modal.advanced.scanFreq.label=Fr\u00E9quence des analyses de s\u00E9curit\u00E9
modal.advanced.scanFreq.hint=Fr\u00E9quence de l'analyse antimalware avant le lancement de ce pack. \u00AB\u00A0Utiliser la valeur par d\u00E9faut globale\u00A0\u00BB suit le r\u00E9glage d\u00E9fini dans Param\u00E8tres \u2192 Avanc\u00E9. Ne la d\u00E9sactivez que si vous faites confiance \u00E0 la source\u00A0: l'analyse est la derni\u00E8re ligne de d\u00E9fense du lanceur contre les mods alt\u00E9r\u00E9s.
modal.advanced.verifyNow=V\u00E9rifier ce pack maintenant
modal.advanced.verifyNow.hint=Recalcule le hash de chaque mod, biblioth\u00E8que et ressource et le compare au manifeste du pack. R\u00E9pare tout ce qui est corrompu. Prend de quelques secondes \u00E0 quelques minutes selon la taille du pack.
modal.advanced.removeOfficial.hint=Ce pack est d\u00E9j\u00E0 export\u00E9 vers le Minecraft Launcher officiel. Le retirer ici supprime le profil et le r\u00E9pertoire de jeu export\u00E9\u00A0; votre installation Mica n'est pas affect\u00E9e.
modal.advanced.addOfficial.hint=Cr\u00E9e dans votre Minecraft Launcher officiel un profil qui pointe vers les mods et configurations de ce pack (les versions Vanilla n'obtiennent qu'une entr\u00E9e de profil, sans copie). Pour les packs modd\u00E9s, le chargeur de mods correspondant peut \u00EAtre install\u00E9 automatiquement pendant l'exportation.
modal.ack.heading=R\u00E9sultats d'analyse accept\u00E9s
modal.ack.intro=Le mainteneur du pack a marqu\u00E9 ces r\u00E9sultats d'analyse pr\u00E9cis comme connus et sans danger, pour que le lanceur ne bloque pas dessus. L'analyse s'ex\u00E9cute toujours sur chaque fichier\u00A0: seules les combinaisons list\u00E9es (fichier + r\u00E8gle + emplacement) sont ignor\u00E9es, et une mise \u00E0 jour du mod qui modifie le contenu du fichier invalide automatiquement l'entr\u00E9e.
