modal.advanced.scanFreq.label=Frequentie van beveiligingsscans
modal.advanced.scanFreq.hint=Hoe vaak de malwarescan wordt uitgevoerd voordat dit pack wordt gestart. "Globale standaard gebruiken" volgt wat u hebt ingesteld in Instellingen \u2192 Geavanceerd. Schakel dit alleen uit als u de bron vertrouwt \u2014 de scan is de laatste verdedigingslinie van de launcher tegen gemanipuleerde mods.
modal.advanced.verifyNow=Dit pack nu verifi\u00EBren
modal.advanced.verifyNow.hint=Hasht elke mod, bibliotheek en asset opnieuw en vergelijkt deze met het manifest van het pack. Herstelt alles wat beschadigd is. Duurt enkele seconden tot een paar minuten, afhankelijk van de grootte van het pack.
modal.advanced.removeOfficial.hint=Dit pack is al ge\u00EBxporteerd naar de offici\u00EBle Minecraft Launcher. Als u het hier verwijdert, worden het profiel en de ge\u00EBxporteerde spelmap verwijderd; uw Mica-installatie blijft ongewijzigd.
modal.advanced.addOfficial.hint=Maakt een profiel aan in uw offici\u00EBle Minecraft Launcher dat verwijst naar de mods en configuraties van dit pack (vanilla-versies krijgen alleen een profielvermelding \u2014 kopi\u00EBren is niet nodig). Packs met mods kunnen tijdens het exporteren automatisch de bijbehorende modloader installeren.
modal.ack.heading=Geaccepteerde scanbevindingen
modal.ack.intro=De beheerder van het pack heeft deze specifieke scanbevindingen als bekend-OK gemarkeerd, zodat de launcher er niet op blokkeert. De scan wordt nog steeds op elk bestand uitgevoerd \u2014 alleen de vermelde combinaties (bestand + regel + locatie) worden genegeerd, en een modupdate die de inhoud van het bestand wijzigt, maakt de vermelding automatisch ongeldig.
