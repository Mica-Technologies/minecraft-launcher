modal.advanced.alwaysVerify.hint=Indien uitgeschakeld (standaard) slaat de launcher het opnieuw hashen over van bestanden die sinds de laatste geslaagde verificatie niet zijn gewijzigd, waardoor volgende starts merkbaar sneller gaan. Schakel dit in als u problemen hebt gehad met beschadigde bestanden of elke keer de strikte integriteitscontrole wilt.
