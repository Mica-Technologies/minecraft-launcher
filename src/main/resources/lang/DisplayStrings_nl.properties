crash.audio.summary=Minecraft kon het audiosubsysteem niet initialiseren. Op Linux is dit meestal een mismatch tussen PulseAudio en ALSA (vooral in containers of nieuwe installaties); op Windows gaat het doorgaans om een uitgeschakeld of losgekoppeld uitvoerapparaat. Als tijdelijke oplossing kunt u Muziek en geluiden ook in het spel uitschakelen.
crash.audio.title=Audio-initialisatie is mislukt
crash.auth.summary=Het spel heeft het sessietoken van de launcher geweigerd. Meestal is de opgeslagen login verlopen; uitloggen bij de launcher en opnieuw inloggen lost het op.
crash.auth.title=Minecraft kon niet authenticeren
crash.diskFull.summary=De schijf raakte tijdens het starten vol. Maak wat ruimte vrij \u2014 modpackwerelden, oude screenshots en crashrapporten in de installatiemap van het pack nemen meestal de meeste ruimte in \u2014 en probeer het opnieuw.
crash.diskFull.title=Schijf vol
crash.fileLock.summary=Een bestand waarnaar het spel probeerde te schrijven, was vergrendeld door een ander proces. Op Windows is dit bijna altijd een antivirusprogramma (of Windows Defender) dat de gedownloade mod of runtime scant \u2014 probeer de installatiemap van de launcher op de uitzonderingenlijst te zetten en start opnieuw. Een andere veelvoorkomende oplossing is OneDrive of andere synchronisatieclients die naar de installatiemap wijzen te sluiten.
crash.fileLock.title=Bestand vergrendeld door een ander proces
crash.forgeDep.summary=Mod "{0}" vereist dat {1} {2} is ge\u00EFnstalleerd, maar er is geen compatibele versie geladen. Voeg de ontbrekende afhankelijkheid toe, werk de bestaande bij naar een passende versie of verwijder de mod die deze vereist.
crash.forgeDep.title=Ontbrekende of niet-passende modafhankelijkheid
crash.gpu.summary=Minecraft kon de grafische laag niet initialiseren. Gebruikelijke oorzaken zijn verouderde GPU-stuurprogramma's, de verkeerde GPU die wordt gekozen op een laptop met zowel ge\u00EFntegreerde als losse graphics, of sessies via een extern bureaublad waarin OpenGL niet wordt versneld.
crash.gpu.title=Grafische initialisatie is mislukt
crash.javaVersion.manifestSuffix=\ De vereiste Java-versie wordt normaal gesproken in het modpackmanifest opgegeven.
crash.javaVersion.summary=Een mod of bibliotheek in dit pack is gecompileerd voor een nieuwere Java-versie dan de runtime die momenteel wordt gebruikt{0}. In het scherm Runtimebeheer van de launcher kunt u een andere Java installeren of kiezen.{1}
crash.javaVersion.targetSuffix=\ (deze mod is bedoeld voor Java {0})
crash.javaVersion.title=Java-versie komt niet overeen
crash.jeiRei.summaryCollision=Twee mods gebruiken hetzelfde recept-ID \u2014 meestal omdat twee mods dezelfde receptidentificatie registreren, of omdat een receptbeheermod (JEI / REI / CraftTweaker) recepten sneller laadt dan de onderliggende mods ze publiceren. Het verwijderen van een van de receptbeheermods verhelpt het probleem meestal.
crash.jeiRei.summaryDual=Zowel Just Enough Items (JEI) als Roughly Enough Items (REI) is ge\u00EFnstalleerd. Ze registreren dezelfde hooks voor de receptweergave en een van beide mislukt bij elke start. Kies er \u00E9\u00E9n \u2014 de meeste moderne packs gebruiken REI op Fabric en JEI op Forge.
crash.jeiRei.titleCollision=Conflict met recept-ID
crash.jeiRei.titleDual=JEI- en REI-conflict
crash.mixin.culpritSuffix=\ \u2014 mixin van "{0}" lijkt de boosdoener te zijn
crash.mixin.summary=De mixinpatch van een mod kon niet worden toegepast{0}. Dit betekent meestal dat twee mods dezelfde klasse proberen te patchen, of dat een van beide deze Minecraft-versie nog niet ondersteunt.
crash.mixin.title=Mixinconflict tussen mods
crash.modLoading.summaryGeneric=Forge kon de mods van dit pack niet goed laden. De meest voorkomende oorzaken zijn een ontbrekende afhankelijkheid, een mod voor een andere Minecraft-/Forge-versie, of twee mods die niet met elkaar overweg kunnen.
crash.modLoading.summaryWithClass=Een mod probeerde klasse "{0}" te gebruiken, maar die werd niet gevonden. Dat betekent meestal dat een vereiste afhankelijke mod ontbreekt of dat er een mod voor een andere Minecraft-/Forge-versie tussen is geslopen.
crash.modLoading.title=Laden van mods mislukt
crash.modMcMismatch.summary=Een mod in dit pack is gemaakt voor Minecraft {0}, maar het pack start Minecraft {1}. Zet de Minecraft-versie van het pack terug, vervang de mod door een versie voor {1}, of verwijder de mod.
