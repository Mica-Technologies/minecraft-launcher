preview.curseforge.note=O CurseForge exige uma chave de API para downloads program\u00E1ticos, por isso o launcher ainda n\u00E3o consegue importar os modpacks dele diretamente. Por enquanto, voc\u00EA pode abrir a p\u00E1gina do projeto abaixo, baixar o ZIP do modpack no CurseForge e reempacot\u00E1-lo como um manifesto Mica ou aguardar a pr\u00F3xima atualiza\u00E7\u00E3o do launcher, que adicionar\u00E1 suporte \u00E0 importa\u00E7\u00E3o do CurseForge.
preview.technic.detected=URL de modpack do Technic detectada.
preview.technic.sourceLabel=Origem: Technic
preview.technic.note=A API do Technic exige um cliente autenticado para acesso program\u00E1tico, por isso este launcher ainda n\u00E3o consegue importar modpacks diretamente da Technic Platform. A alternativa:
preview.technic.step1=1. Abra a p\u00E1gina do projeto abaixo.
preview.technic.step2=2. Procure o link "Server Download" na p\u00E1gina do modpack e baixe o ZIP do servidor.
preview.technic.step3=3. De volta a este launcher, clique em "Importar ZIP" na tela Explorar e escolha o ZIP baixado. O launcher reconhecer\u00E1 o formato de pacote de servidor do Technic e o configurar\u00E1 para voc\u00EA.
