quickStart.welcome.heading=Bem-vindo ao Mica Minecraft Launcher
quickStart.welcome.subtitle=Uma configura\u00E7\u00E3o r\u00E1pida para deixar o launcher do seu jeito desde a primeira sess\u00E3o. Escolha um tema, ajuste a aloca\u00E7\u00E3o de mem\u00F3ria e ative ou desative algumas prefer\u00EAncias \u2014 tudo isso pode ser alterado depois em Configura\u00E7\u00F5es.
