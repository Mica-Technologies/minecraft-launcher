modal.advanced.hint=Controles avan\u00E7ados por modpack. Os padr\u00F5es s\u00E3o adequados para a maioria dos usu\u00E1rios.
modal.advanced.alwaysVerify=Sempre verificar os arquivos do jogo ao iniciar
modal.advanced.alwaysVerify.hint=Quando desativado (padr\u00E3o), o launcher deixa de recalcular o hash dos arquivos que n\u00E3o mudaram desde a \u00FAltima verifica\u00E7\u00E3o bem-sucedida, tornando as inicializa\u00E7\u00F5es seguintes visivelmente mais r\u00E1pidas. Ative se voc\u00EA teve problemas com arquivos corrompidos ou quer a verifica\u00E7\u00E3o rigorosa de integridade todas as vezes.
