crash.audio.summary=O Minecraft n\u00E3o conseguiu inicializar o subsistema de \u00E1udio. No Linux, isso geralmente \u00E9 uma incompatibilidade entre PulseAudio \u2194 ALSA (especialmente em cont\u00EAineres ou instala\u00E7\u00F5es novas); no Windows, normalmente \u00E9 um dispositivo de sa\u00EDda desativado/desconectado. Como alternativa, voc\u00EA tamb\u00E9m pode desativar M\u00FAsica e Sons no jogo.
crash.audio.title=Falha na inicializa\u00E7\u00E3o do \u00E1udio
crash.auth.summary=O jogo rejeitou o token de sess\u00E3o fornecido pelo launcher. Normalmente, o login salvo expirou; sair da conta no launcher e fazer login novamente resolve o problema.
crash.auth.title=O Minecraft n\u00E3o conseguiu autenticar
crash.diskFull.summary=O sistema ficou sem espa\u00E7o em disco durante a inicializa\u00E7\u00E3o. Libere espa\u00E7o \u2014 mundos do modpack, capturas de tela antigas e relat\u00F3rios de travamento na pasta de instala\u00E7\u00E3o do modpack costumam ser os maiores culpados \u2014 e tente novamente.
crash.diskFull.title=Disco cheio
crash.fileLock.summary=Um arquivo que o jogo tentou gravar estava bloqueado por outro processo. No Windows, quase sempre \u00E9 um antiv\u00EDrus (ou o Windows Defender) verificando o mod ou o runtime baixado \u2014 tente adicionar a pasta de instala\u00E7\u00E3o do launcher \u00E0s exce\u00E7\u00F5es e inicie novamente. Fechar o OneDrive ou outros clientes de sincroniza\u00E7\u00E3o que apontem para a pasta de instala\u00E7\u00E3o \u00E9 a outra solu\u00E7\u00E3o comum.
crash.fileLock.title=Arquivo bloqueado por outro processo
crash.forgeDep.summary=O mod "{0}" precisa de {1} {2} instalado, mas nenhuma vers\u00E3o compat\u00EDvel est\u00E1 carregada. Adicione a depend\u00EAncia ausente, atualize a existente para uma vers\u00E3o compat\u00EDvel ou remova o mod que a exige.
crash.forgeDep.title=Depend\u00EAncia de mod ausente ou incompat\u00EDvel
crash.gpu.summary=O Minecraft n\u00E3o conseguiu inicializar a camada gr\u00E1fica. As causas comuns s\u00E3o drivers de GPU desatualizados, a GPU errada sendo escolhida em um notebook com gr\u00E1ficos integrados e dedicados, ou sess\u00F5es de \u00E1rea de trabalho remota em que o OpenGL n\u00E3o \u00E9 acelerado.
crash.gpu.title=Falha na inicializa\u00E7\u00E3o dos gr\u00E1ficos
crash.javaVersion.manifestSuffix=\ A vers\u00E3o do Java necess\u00E1ria normalmente \u00E9 declarada no manifesto do modpack.
crash.javaVersion.summary=Um mod ou biblioteca deste modpack foi compilado para uma vers\u00E3o do Java mais recente que a do runtime em uso{0}. A tela de gerenciamento de runtimes do launcher pode instalar ou escolher outro Java.{1}
crash.javaVersion.targetSuffix=\ (este mod requer o Java {0})
crash.javaVersion.title=Vers\u00E3o do Java incompat\u00EDvel
crash.jeiRei.summaryCollision=Houve uma colis\u00E3o de ID de receita entre dois mods \u2014 normalmente quando dois mods registram o mesmo identificador de receita, ou quando um mod de gerenciamento de receitas (JEI / REI / CraftTweaker) carrega as receitas antes que os mods subjacentes as publiquem. Remover um dos mods de gerenciamento de receitas geralmente desbloqueia a inicializa\u00E7\u00E3o.
crash.jeiRei.summaryDual=Just Enough Items (JEI) e Roughly Enough Items (REI) est\u00E3o instalados ao mesmo tempo. Eles registram os mesmos hooks de visualizador de receitas, e um deles falhar\u00E1 a cada inicializa\u00E7\u00E3o. Escolha um \u2014 a maioria dos modpacks modernos usa REI no Fabric e JEI no Forge.
crash.jeiRei.titleCollision=Colis\u00E3o de ID de receita
crash.jeiRei.titleDual=Conflito entre JEI e REI
crash.mixin.culpritSuffix=\ \u2014 o mixin de "{0}" parece ser o culpado
crash.mixin.summary=N\u00E3o foi poss\u00EDvel aplicar o patch de mixin de um mod{0}. Isso geralmente significa que dois mods est\u00E3o tentando modificar a mesma classe ou que um deles ainda n\u00E3o \u00E9 compat\u00EDvel com esta vers\u00E3o do Minecraft.
crash.mixin.title=Conflito de mixin entre mods
crash.modLoading.summaryGeneric=O Forge n\u00E3o conseguiu carregar corretamente os mods deste modpack. As causas mais comuns s\u00E3o uma depend\u00EAncia ausente, um mod feito para outra vers\u00E3o do Minecraft / Forge ou dois mods incompat\u00EDveis entre si.
crash.modLoading.summaryWithClass=Um mod tentou usar a classe "{0}", mas ela n\u00E3o foi encontrada. Isso geralmente significa que falta um mod de depend\u00EAncia necess\u00E1rio ou que entrou um mod de outra vers\u00E3o do Minecraft / Forge.
crash.modLoading.title=Falha no carregamento do mod
crash.modMcMismatch.summary=Um mod deste modpack foi feito para o Minecraft {0}, mas o modpack est\u00E1 iniciando o Minecraft {1}. Fa\u00E7a o downgrade da vers\u00E3o do Minecraft do modpack, troque o mod por um feito para {1} ou remova-o.
crash.modMcMismatch.title=Mod feito para o Minecraft {0}, modpack executa {1}
crash.nativeLib.summary=A JVM n\u00E3o conseguiu carregar uma das bibliotecas nativas do Minecraft (normalmente LWJGL ou um binding JNI). As causas comuns s\u00E3o um antiv\u00EDrus que colocou o arquivo em quarentena, uma instala\u00E7\u00E3o corrompida ou \u2014 no Linux \u2014 uma biblioteca do sistema ausente. Reinstalar o modpack geralmente resolve.
crash.nativeLib.title=N\u00E3o foi poss\u00EDvel carregar uma biblioteca nativa
crash.oom.detailSuffix=\ ({0})
crash.oom.increaseRam=Aumentar a RAM m\u00E1xima para {0} GB
crash.oom.openRamSettings=Abrir configura\u00E7\u00F5es de RAM
crash.oom.summary=O Minecraft ficou sem mem\u00F3ria{0}. A RAM m\u00E1xima do launcher est\u00E1 em {1} GB; este modpack precisa de mais.
crash.oom.systemTotal=\ Seu sistema tem cerca de {0} GB no total.
crash.oom.title=Sem mem\u00F3ria
crash.optifineSodium.summary=OptiFine e Sodium est\u00E3o instalados ao mesmo tempo. Eles modificam os mesmos componentes internos de renderiza\u00E7\u00E3o do Minecraft de formas incompat\u00EDveis e n\u00E3o podem coexistir com seguran\u00E7a \u2014 escolha um. O Sodium precisa do loader Fabric; o OptiFine funciona no Forge ou com a ponte OptiFabric. Os bot\u00F5es Desativar abaixo renomeiam um dos dois JARs para {name}.jar.disabled, para que o loader o ignore na pr\u00F3xima inicializa\u00E7\u00E3o.
crash.optifineSodium.title=OptiFine e Sodium s\u00E3o incompat\u00EDveis
crash.unknown.summary=N\u00E3o conseguimos identificar uma causa espec\u00EDfica no relat\u00F3rio de travamento. C\u00F3digo de sa\u00EDda {0}. Confira o relat\u00F3rio completo abaixo para mais detalhes; a linha que come\u00E7a com "Caused by:" geralmente \u00E9 o ponto de partida mais \u00FAtil.
crash.unknown.title=O Minecraft travou
crash.world.summary=O Minecraft n\u00E3o conseguiu ler um arquivo do mundo salvo \u2014 um chunk, uma regi\u00E3o ou o level.dat est\u00E1 ileg\u00EDvel. Causas comuns: uma reinicializa\u00E7\u00E3o inesperada durante um salvamento anterior, dois mods gravando NBT conflitante, ou um mod removido entre sess\u00F5es cujos dados ainda est\u00E3o no disco. Tente carregar outro mundo ou restaure um backup recente.
crash.world.title=N\u00E3o foi poss\u00EDvel ler os dados do mundo
