settings.fxml.showWhatYou=Mostre o que voc\u00EA est\u00E1 jogando no seu perfil do Discord. Requer que o aplicativo do Discord para desktop esteja aberto no mesmo computador \u2014 o launcher se comunica com ele localmente via IPC, sem necessidade de token ou login.
settings.fxml.friendInvites=Convites de amigos
settings.fxml.allowDiscordInvites=Permitir convites do Discord
settings.fxml.whenEnabledFriends=Quando ativado, amigos que veem seu status do Discord enquanto voc\u00EA est\u00E1 jogando recebem um bot\u00E3o "Entrar no jogo" no seu perfil, que instala e inicia automaticamente o mesmo modpack no computador deles. Isso desativa apenas o bot\u00E3o de entrar \u2014 o Rich Presence em si \u00E9 controlado pela op\u00E7\u00E3o acima.
settings.fxml.youCanAlso=Voc\u00EA tamb\u00E9m pode clicar com o bot\u00E3o direito em qualquer cart\u00E3o de modpack no menu principal e escolher "Copiar link de convite do Discord" para compartilhar a URL de convite diretamente em qualquer chat.
settings.fxml.rgbLighting=Ilumina\u00E7\u00E3o RGB
settings.fxml.lightingBackend=Back-end de ilumina\u00E7\u00E3o
settings.fxml.enableRgbLighting=Ativar ilumina\u00E7\u00E3o RGB
settings.fxml.whenEnabledThe=Quando ativado, o launcher ilumina seu teclado compat\u00EDvel com cores baseadas no modpack enquanto voc\u00EA joga. Desativado por padr\u00E3o \u2014 ative apenas se quiser que o launcher se comunique com seus perif\u00E9ricos.
settings.fxml.backend=Back-end:
settings.fxml.disabled=Desativado
settings.fxml.autoRunsEvery=O modo Auto executa todos os back-ends ativados abaixo que tenham hardware dispon\u00EDvel, para que uma configura\u00E7\u00E3o mista (por exemplo, ventoinhas Razer + um teclado com Windows Dynamic Lighting) acenda tudo de uma vez. Escolha um back-end espec\u00EDfico para for\u00E7ar apenas ele.
settings.fxml.autoModeIntegrations=Integra\u00E7\u00F5es de modo autom\u00E1tico:
settings.fxml.openrgb=OpenRGB
settings.fxml.razerChromaNative=Razer Chroma (SDK nativo)
settings.fxml.windowsDynamicLighting=Windows Dynamic Lighting
settings.fxml.corsairIcue=Corsair iCUE
settings.fxml.asusAuraLegacy=ASUS Aura (SDK legado)
settings.fxml.razerChromaRest=Razer Chroma (REST \u2013 legado)
settings.fxml.turnOffThe=Desative as integra\u00E7\u00F5es que voc\u00EA n\u00E3o quer que o launcher acesse, mesmo que o software delas esteja instalado. O Chroma REST vem desativado por padr\u00E3o, j\u00E1 que o SDK nativo o substitui em qualquer instala\u00E7\u00E3o funcional do Synapse.
settings.fxml.menuEffect=Efeito de menu
settings.fxml.lightUpDevices=Iluminar dispositivos nos menus
settings.fxml.whenOnYour=Quando ativado, seus dispositivos acendem enquanto voc\u00EA est\u00E1 nos menus do launcher, usando a cor de destaque do tema ativo. Abrir a tela de detalhes de um modpack muda para as cores extra\u00EDdas desse modpack. Quando desativado, os dispositivos ficam apagados entre as inicializa\u00E7\u00F5es do jogo.
settings.fxml.animationStyle=Estilo de anima\u00E7\u00E3o
settings.fxml.solidSingleSteady=S\u00F3lido: uma \u00FAnica cor fixa. Respirar: aparece e desaparece lentamente (padr\u00E3o). Pulso: pulsa\u00E7\u00E3o mais r\u00E1pida entre a cor de destaque e sua complementar. Ciclo: loop suave por 3 a 4 cores \u2014 extra\u00EDdas do logotipo do modpack quando h\u00E1 um modpack em foco; caso contr\u00E1rio, tons an\u00E1logos \u00E0 cor de destaque do tema. Arco-\u00EDris: varredura cont\u00EDnua de matiz por todo o espectro, sem depender do modpack.
settings.fxml.inGameEffects=Efeitos no jogo
settings.fxml.useModpackColors=Usar cores do modpack
settings.fxml.lightUpThe=Ilumina o teclado com cores extra\u00EDdas do logotipo do modpack em execu\u00E7\u00E3o. Quando desativado, os efeitos usam a paleta de destaque do tema do launcher.
settings.fxml.highlightMinecraftKeys=Destacar as teclas do Minecraft
settings.fxml.overlayWasdE=Sobrep\u00F5e WASD / E / Q / F / Espa\u00E7o / Shift / Ctrl em uma cor de destaque contrastante sobre o fundo com as cores do modpack, para que as teclas de jogo se destaquem rapidamente.
settings.fxml.test=Testar
settings.fxml.flashesSolidMagenta=Pisca em magenta s\u00F3lido (RGB 255, 0, 255) em todos os dispositivos conectados por 2 segundos e depois restaura o efeito anterior. Um flash est\u00E1vel e com brilho total confirma que o back-end est\u00E1 alcan\u00E7ando o seu hardware. Observa\u00E7\u00E3o para o Razer Chroma: o Chroma Connect s\u00F3 encaminha quadros para dispositivos de terceiros (ventoinhas de gabinete, fitas etc.) quando um dispositivo Razer principal \u2014 teclado, mouse ou mousepad \u2014 tamb\u00E9m est\u00E1 conectado. Se apenas esses dispositivos de terceiros piscarem ou ficarem apagados, conecte um teclado/mouse Razer e tente novamente. Piscadas com um dispositivo principal presente geralmente indicam que outro aplicativo RGB (Synapse, iCUE, Signal RGB) est\u00E1 disputando o dispositivo.
settings.fxml.testConnection=Testar conex\u00E3o
settings.fxml.micaMinecraftLauncher=Mica Minecraft Launcher
settings.fxml.version=Vers\u00E3o ...
settings.fxml.checkForLauncher=Verificar atualiza\u00E7\u00F5es do launcher
settings.fxml.whenOffThe=Quando desativado, o launcher n\u00E3o far\u00E1 consultas na inicializa\u00E7\u00E3o nem mostrar\u00E1 o \u00EDcone de atualiza\u00E7\u00E3o dispon\u00EDvel na barra de navega\u00E7\u00E3o.
settings.fxml.visitWebsite=Visitar site
settings.fxml.viewSource=Ver c\u00F3digo-fonte
settings.fxml.minecraftTrademark=Marca registrada do Minecraft
settings.fxml.minecraftIsA=Minecraft \u00E9 uma marca registrada da Mojang Synergies AB e da Microsoft Corporation. Este launcher usa o nome Minecraft apenas para identificar o jogo que inicia e n\u00E3o \u00E9 afiliado, endossado, patrocinado ou especificamente aprovado pela Mojang AB ou pela Microsoft.
settings.fxml.openSourceAcknowledgments=Agradecimentos de c\u00F3digo aberto
settings.fxml.theLauncherUses=O launcher usa os seguintes softwares de c\u00F3digo aberto:
settings.fxml.fullLicenseTexts=Os textos completos das licen\u00E7as acompanham o launcher instalado, na pasta LICENSES, e est\u00E3o dispon\u00EDveis no reposit\u00F3rio do c\u00F3digo-fonte deste projeto.
settings.fxml.javaRuntimes=Runtimes Java
settings.fxml.modernMinecraftVersions=As vers\u00F5es modernas do Minecraft usam as distribui\u00E7\u00F5es oficiais de runtime Java da Mojang. O Forge legado (Minecraft 1.12.2 e anteriores) usa o Bell-SW Liberica JRE 8 para compatibilidade.
settings.fxml.arm64NativeLibraries=Bibliotecas nativas ARM64
settings.fxml.whenLwjglArm=Quando a corre\u00E7\u00E3o LWJGL ARM est\u00E1 ativada, o launcher substitui as bibliotecas nativas x86_64 do LWJGL2 e do jinput que acompanham o Minecraft 1.12.2 e anteriores por bin\u00E1rios ARM64 compilados pela comunidade. Agradecemos aos mantenedores destes projetos:
