startup.alreadyRunning.noWindow=O Mica Minecraft Launcher j\u00E1 est\u00E1 em execu\u00E7\u00E3o, mas sua janela n\u00E3o foi aberta. Ele ainda pode estar iniciando. Se nenhuma janela aparecer, encerre o Mica Minecraft Launcher no Gerenciador de Tarefas (Monitor de Atividade no macOS) e inicie-o novamente.
startup.portUnavailable=O Mica Minecraft Launcher n\u00E3o p\u00F4de ser iniciado porque a porta local {0} n\u00E3o est\u00E1 dispon\u00EDvel ({1}).\n\nOutra c\u00F3pia do launcher pode ainda estar sendo fechada, ou outro programa ou uma reserva de portas do Windows pode estar usando a porta. Aguarde alguns segundos e tente novamente. Se isso continuar acontecendo, reinicie o computador.
startup.alreadyRunning.unreachable=O Mica Minecraft Launcher j\u00E1 est\u00E1 em execu\u00E7\u00E3o, mas esta inicializa\u00E7\u00E3o n\u00E3o conseguiu se comunicar com ele. Alterne para ele pela barra de tarefas ou encerre o Mica Minecraft Launcher no Gerenciador de Tarefas (Monitor de Atividade no macOS) e inicie-o novamente.
