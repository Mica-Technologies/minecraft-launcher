tooltip.settings.discordInvites=Enquanto voc\u00EA estiver jogando, seus amigos ver\u00E3o um bot\u00E3o Entrar no jogo no seu status do Discord, que instala e inicia o mesmo modpack no computador deles.
tooltip.settings.enhancedLogging=Grava informa\u00E7\u00F5es de diagn\u00F3stico adicionais em arquivos de log.
tooltip.settings.inGameConsole=Mostra um console com a sa\u00EDda do jogo em tempo real enquanto voc\u00EA joga. \u00DAtil para depura\u00E7\u00E3o.
tooltip.settings.batteryThrottle=Reduz a velocidade dos downloads em notebooks usando bateria para economizar energia. Desktops e dispositivos ligados na tomada nunca s\u00E3o limitados.
tooltip.settings.theme=Escolha o tema visual do launcher. Autom\u00E1tico segue a configura\u00E7\u00E3o do seu sistema operacional.
tooltip.settings.jvmPreset=Flags de ajuste da JVM. Desempenho (Aikar's Flags) \u00E9 o recomendado para a maioria dos usu\u00E1rios.
tooltip.settings.proxyEnable=Ative se voc\u00EA estiver atr\u00E1s de um proxy/firewall corporativo ou escolar.
