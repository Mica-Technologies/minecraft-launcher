tooltip.settings.resetLauncher=Exclui todos os dados do launcher e restaura os padr\u00F5es. Use como \u00FAltimo recurso!
tooltip.settings.resetRuntime=Remove todos os runtimes Java em cache. Eles ser\u00E3o baixados novamente na pr\u00F3xima inicializa\u00E7\u00E3o.
tooltip.settings.exportSettings=Salve as configura\u00E7\u00F5es atuais do launcher em um arquivo JSON para backup ou compartilhamento.
tooltip.settings.importSettings=Carregue as configura\u00E7\u00F5es de um arquivo JSON exportado anteriormente.
tooltip.settings.generateJvmArgs=Gera uma string de argumentos da JVM ajustada \u00E0 sua CPU, RAM e configura\u00E7\u00E3o de heap m\u00E1ximo.
tooltip.main.search=Filtra os modpacks. Cada palavra separada por espa\u00E7o deve corresponder a alguma parte do nome, da vers\u00E3o, da vers\u00E3o do Minecraft ou da vers\u00E3o do Forge do modpack. Experimente "1.12", "forge" ou "biomes 1.12".
tooltip.main.typeFilter=Filtrar por modpack ou vers\u00E3o Vanilla.
tooltip.main.sortFilter=Escolha como os modpacks s\u00E3o ordenados na grade.
tooltip.main.recentlyUpdated=Mostrar apenas modpacks cujo manifesto mudou desde a \u00FAltima inicializa\u00E7\u00E3o.
tooltip.main.pageSize=Quantos cart\u00F5es exibir por p\u00E1gina.
