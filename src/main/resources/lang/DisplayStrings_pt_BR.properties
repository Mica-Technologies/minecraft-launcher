scanFrequency.DAILY=Diariamente (e quando houver altera\u00E7\u00F5es)
scanFrequency.DISABLED=Desativado
scanFrequency.EVERY_TIME=Todas as vezes
scanFrequency.ON_CHANGES_ONLY=Somente quando houver altera\u00E7\u00F5es
modal.advanced.scanFreq.label=Frequ\u00EAncia de verifica\u00E7\u00E3o de seguran\u00E7a
modal.advanced.scanFreq.hint=Com que frequ\u00EAncia executar a verifica\u00E7\u00E3o de malware antes de iniciar este modpack. "Usar padr\u00E3o global" segue o que voc\u00EA definiu em Configura\u00E7\u00F5es \u2192 Avan\u00E7ado. Desative apenas se voc\u00EA confia na origem \u2014 a verifica\u00E7\u00E3o \u00E9 a \u00FAltima linha de defesa do launcher contra mods adulterados.
modal.advanced.verifyNow=Verificar este modpack agora
modal.advanced.verifyNow.hint=Recalcula o hash de cada mod, biblioteca e recurso e compara com o manifesto do modpack. Repara tudo o que estiver corrompido. Leva de alguns segundos a alguns minutos, dependendo do tamanho do modpack.
modal.advanced.removeOfficial.hint=Este modpack j\u00E1 foi exportado para o Minecraft Launcher oficial. Remover aqui exclui o perfil e o diret\u00F3rio de jogo exportado; sua instala\u00E7\u00E3o no Mica n\u00E3o \u00E9 afetada.
modal.advanced.addOfficial.hint=Cria um perfil no seu Minecraft Launcher oficial que aponta para os mods e as configura\u00E7\u00F5es deste modpack (vers\u00F5es Vanilla recebem apenas um perfil \u2014 nenhuma c\u00F3pia \u00E9 necess\u00E1ria). Modpacks com mods podem instalar automaticamente o mod loader correspondente durante a exporta\u00E7\u00E3o.
modal.ack.heading=Alertas da verifica\u00E7\u00E3o reconhecidos
modal.ack.intro=O mantenedor do modpack marcou estes alertas espec\u00EDficos da verifica\u00E7\u00E3o como conhecidos e seguros, para que o launcher n\u00E3o seja bloqueado por eles. A verifica\u00E7\u00E3o continua sendo executada em todos os arquivos \u2014 apenas as combina\u00E7\u00F5es listadas (arquivo + regra + local) s\u00E3o silenciadas, e uma atualiza\u00E7\u00E3o de mod que altere o conte\u00FAdo do arquivo invalida a entrada automaticamente.
