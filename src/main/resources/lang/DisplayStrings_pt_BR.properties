settings.fxml.whenEnabledQuot=Quando ativado, os links "Instalar no Launcher" do site e os bot\u00F5es "Join Game" do Discord abrem este launcher e adicionam ou iniciam o modpack vinculado. Hosts n\u00E3o confi\u00E1veis sempre exigem um clique de confirma\u00E7\u00E3o antes da instala\u00E7\u00E3o.
