settings.fxml.howOftenThe=Com que frequ\u00EAncia a verifica\u00E7\u00E3o de malware \u00E9 executada antes da inicializa\u00E7\u00E3o. Diariamente \u00E9 o recomendado \u2014 detecta altera\u00E7\u00F5es no manifesto imediatamente e, fora isso, executa no m\u00E1ximo uma vez por dia para que as inicializa\u00E7\u00F5es continuem r\u00E1pidas. Cada modpack pode substituir isso em sua se\u00E7\u00E3o Avan\u00E7ado.
settings.fxml.gameFileIntegrity=Integridade dos arquivos do jogo
settings.fxml.reHashesEvery=Recalcula o hash de cada mod, biblioteca e recurso de todos os modpacks instalados e compara com o manifesto. Repara tudo o que estiver corrompido. Leva alguns segundos por modpack \u2014 bibliotecas grandes podem levar alguns minutos no total.
settings.fxml.verifyAllGame=Verificar todos os arquivos do jogo
settings.fxml.thirdPartyIntegrations=Integra\u00E7\u00F5es de terceiros
settings.fxml.curseforgeCoreApi=Chave da API Core do CurseForge. Necess\u00E1ria para importar modpacks do CurseForge por URL. Obtenha uma em console.curseforge.com \u2192 My API Keys. Armazenada criptografada neste computador usando o mesmo esquema que protege seu token de login do Minecraft \u2014 ela nunca sai do launcher em texto simples.
